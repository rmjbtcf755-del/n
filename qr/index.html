<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Печать этикеток — позиции</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background:#eef1f5; padding:16px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .controls {
    background:#fff; padding:16px; border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    width:100%; max-width:720px;
    display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;
  }
  .controls label {
    font-weight:600; font-size:13px;
    display:flex; flex-direction:column; gap:4px;
  }
  .controls label.full { grid-column:1 / -1; }
  .controls input[type=text],
  .controls input[type=number],
  .controls select {
    padding:7px 9px; font-size:14px; border:1px solid #ccd2da;
    border-radius:6px; width:100%; background:#fff;
  }
  .controls .row { display:flex; gap:8px; }
  .controls .row > * { flex:1; }

  .section-title {
    grid-column:1 / -1; font-size:12px; text-transform:uppercase;
    letter-spacing:.06em; color:#8a94a0; font-weight:700; margin-top:4px;
  }
  .controls button {
    grid-column:1 / -1; padding:10px; font-size:15px; font-weight:700;
    border:none; border-radius:6px; cursor:pointer; transition:.15s;
  }
  #printBtn { background:#007bff; color:#fff; }
  #printBtn:hover { background:#0056b3; }
  #resetBtn { background:#f1f3f6; color:#333; }
  #resetBtn:hover { background:#e2e6ec; }

  /* ===== Менеджер позиций ===== */
  .positions-bar {
    grid-column:1 / -1;
    background:#f7f9fc; border:1px solid #dfe4ea; border-radius:8px;
    padding:12px; display:flex; flex-direction:column; gap:10px;
  }
  .positions-bar .line {
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .positions-bar select {
    flex:1; min-width:180px;
    padding:7px 9px; font-size:14px; border:1px solid #ccd2da;
    border-radius:6px; background:#fff;
  }
  .positions-bar button {
    padding:7px 12px; font-size:13px; font-weight:700;
    border:none; border-radius:6px; cursor:pointer; transition:.15s;
    grid-column:auto; width:auto;
  }
  .btn-save   { background:#28a745; color:#fff; }
  .btn-save:hover   { background:#218838; }
  .btn-del    { background:#dc3545; color:#fff; }
  .btn-del:hover    { background:#c82333; }
  .btn-del:disabled { background:#e8a0a7; cursor:not-allowed; }
  .btn-new    { background:#6c757d; color:#fff; }
  .btn-new:hover    { background:#5a6268; }
  .btn-exp    { background:#17a2b8; color:#fff; }
  .btn-exp:hover    { background:#138496; }
  .btn-imp    { background:#ffc107; color:#212529; }
  .btn-imp:hover    { background:#e0a800; }

  /* ===== Модалка импорта ===== */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center; z-index:1000;
    padding:16px;
  }
  .modal-overlay.show { display:flex; }
  .modal {
    background:#fff; border-radius:12px; padding:20px; width:100%;
    max-width:520px; box-shadow:0 20px 50px rgba(0,0,0,.3);
    display:flex; flex-direction:column; gap:14px;
  }
  .modal h3 { font-size:18px; }
  .modal .info { font-size:13px; color:#555; line-height:1.4; }
  .modal .options { display:flex; flex-direction:column; gap:8px; }
  .modal .opt {
    display:flex; align-items:flex-start; gap:10px; padding:10px;
    border:2px solid #e3e7ec; border-radius:8px; cursor:pointer;
    transition:.15s; font-size:14px;
  }
  .modal .opt:hover { background:#f5f9ff; border-color:#bcd4ff; }
  .modal .opt input { margin-top:3px; }
  .modal .opt strong { display:block; }
  .modal .opt small { color:#666; font-size:12px; }
  .modal .keep-standard {
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:600; padding:10px;
    background:#fff8e1; border-radius:8px; border:1px solid #ffe082;
  }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; }
  .modal .actions button {
    padding:9px 16px; border-radius:6px; font-size:14px; font-weight:700;
    border:none; cursor:pointer; transition:.15s;
  }
  .btn-cancel { background:#f1f3f6; color:#333; }
  .btn-cancel:hover { background:#e2e6ec; }
  .btn-confirm { background:#007bff; color:#fff; }
  .btn-confirm:hover { background:#0056b3; }

  /* ===== Этикетка ===== */
  .label {
    position:relative; background:#fff;
    border:1px dashed #b9c0c9;
    overflow:hidden; touch-action:none;
    user-select:none;
  }
  .label .hint {
    position:absolute; inset:0; display:flex;
    align-items:center; justify-content:center;
    color:#b0b7c0; font-size:12px; text-align:center;
    padding:8px; pointer-events:none;
    line-height:1.4;
  }

  .draggable {
    position:absolute; cursor:grab; user-select:none;
    touch-action:none; outline:1px dashed transparent;
  }
  .draggable:hover { outline-color:#7aa7ff; }
  .draggable.active { outline:1px solid #007bff; }
  .draggable:active { cursor:grabbing; }
  .draggable .handle {
    position:absolute; right:-6px; bottom:-6px;
    width:12px; height:12px; background:#007bff;
    border:2px solid #fff; border-radius:50%;
    cursor:nwse-resize; display:none;
    box-shadow:0 0 0 1px #007bff;
  }
  .draggable.active .handle { display:block; }
  .draggable svg { display:block; width:100%; height:100%; }
  .draggable .text {
    width:100%; height:100%; display:flex;
    align-items:center; justify-content:center;
    text-align:center; line-height:1.15;
    word-break:break-all; overflow:hidden;
    font-family:Arial, sans-serif;
  }

  /* ===== Контекстное меню ===== */
  .ctx-menu {
    position:fixed; background:#fff; border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
    border:1px solid #e3e7ec; padding:6px; min-width:200px;
    z-index:2000; display:none;
  }
  .ctx-menu.show { display:block; }
  .ctx-menu .item {
    padding:8px 12px; font-size:14px; border-radius:5px;
    cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .ctx-menu .item:hover { background:#eef4ff; }
  .ctx-menu .item.disabled {
    color:#b0b7c0; cursor:not-allowed;
  }
  .ctx-menu .item.disabled:hover { background:transparent; }
  .ctx-menu .sep {
    height:1px; background:#e3e7ec; margin:4px 0;
  }
  .ctx-menu .title {
    font-size:11px; text-transform:uppercase; color:#8a94a0;
    font-weight:700; padding:6px 12px 2px; letter-spacing:.05em;
  }

  @page { margin:0; }
  @media print {
    html, body { background:#fff; padding:0; margin:0; }
    .controls { display:none !important; }
    .label { border:none !important; page-break-after:always; margin:0 auto; }
    .label .hint { display:none !important; }
    .draggable { outline:none !important; }
    .handle { display:none !important; }
    .modal-overlay, .ctx-menu { display:none !important; }
  }
</style>
</head>
<body>

<div class="controls">

  <!-- ===== Менеджер позиций ===== -->
  <div class="positions-bar">
    <div class="section-title" style="margin:0;">Позиция (раскладка)</div>
    <div class="line">
      <select id="positionSelect"></select>
      <button class="btn-save" id="savePosBtn" title="Принудительно сохранить (автосохранение и так работает)">💾 Сохранить</button>
      <button class="btn-new"  id="newPosBtn"  title="Создать новую позицию">＋ Новая</button>
      <button class="btn-del"  id="delPosBtn"  title="Удалить выбранную позицию">🗑 Удалить</button>
    </div>
    <div class="line">
      <button class="btn-exp" id="exportBtn" title="Скачать positions.json">⬇ Экспорт positions.json</button>
      <button class="btn-imp" id="importBtn" title="Загрузить positions.json">⬆ Импорт positions.json</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </div>

  <div class="section-title">Штрихкод</div>
  <label>Данные:
    <input type="text" id="barcodeInput" value="123456789012">
  </label>
  <label>Формат:
    <select id="barcodeFormat">
      <option value="CODE128">CODE128</option>
      <option value="EAN13">EAN13</option>
      <option value="EAN8">EAN8</option>
      <option value="UPC">UPC</option>
      <option value="CODE39">CODE39</option>
      <option value="ITF14">ITF14</option>
    </select>
  </label>

  <div class="section-title">QR-код</div>
  <label class="full">Данные:
    <input type="text" id="qrInput" value="https://example.com">
  </label>

  <div class="section-title">Название</div>
  <label class="full">Текст названия:
    <input type="text" id="nameInput" value="Товар">
  </label>

  <div class="section-title">Размеры и отступы</div>
  <label>Размер этикетки (мм):
    <div class="row">
      <input type="number" id="labelW" min="10" step="1" value="58">
      <input type="number" id="labelH" min="10" step="1" value="40">
    </div>
  </label>
  <label>Отступ от краёв, мм:
    <input type="number" id="paddingInput" min="0" step="0.5" value="2">
  </label>

  <label>Шрифт номера (px):
    <input type="number" id="barcodeTextSize" min="4" max="40" step="1" value="10">
  </label>
  <label>Шрифт названия (px):
    <input type="number" id="nameTextSize" min="4" max="60" step="1" value="14">
  </label>

  <button id="printBtn">🖨 Печать</button>
  <button id="resetBtn">Сбросить позиции блоков</button>
</div>

<div id="labelContainer"></div>

<!-- ===== Модалка импорта ===== -->
<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h3>Импорт positions.json</h3>
    <div class="info" id="importInfo"></div>
    <div class="options">
      <label class="opt">
        <input type="radio" name="importMode" value="merge" checked>
        <span><strong>Добавить (объединить)</strong>
        <small>Новые позиции добавляются. Существующие с теми же именами <u>не изменяются</u>.</small></span>
      </label>
      <label class="opt">
        <input type="radio" name="importMode" value="update">
        <span><strong>Обновить одноимённые</strong>
        <small>Новые добавляются, одноимённые существующие — <u>перезаписываются</u> из файла.</small></span>
      </label>
      <label class="opt">
        <input type="radio" name="importMode" value="replace">
        <span><strong>Заменить всё</strong>
        <small>Текущий список полностью заменяется списком из файла.</small></span>
      </label>
    </div>
    <label class="keep-standard">
      <input type="checkbox" id="keepStandard" checked>
      Сохранить встроенную позицию «Стандарт», даже если её нет в файле
    </label>
    <div class="actions">
      <button class="btn-cancel" id="importCancel">Отмена</button>
      <button class="btn-confirm" id="importConfirm">Импортировать</button>
    </div>
  </div>
</div>

<!-- ===== Контекстное меню ===== -->
<div class="ctx-menu" id="ctxMenu"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const barcodeInput    = $('barcodeInput');
  const barcodeFormat   = $('barcodeFormat');
  const qrInput         = $('qrInput');
  const nameInput       = $('nameInput');
  const labelW          = $('labelW');
  const labelH          = $('labelH');
  const paddingInput    = $('paddingInput');
  const barcodeTextSize = $('barcodeTextSize');
  const nameTextSize    = $('nameTextSize');
  const labelContainer  = $('labelContainer');
  const printBtn        = $('printBtn');
  const resetBtn        = $('resetBtn');

  const positionSelect  = $('positionSelect');
  const savePosBtn      = $('savePosBtn');
  const newPosBtn       = $('newPosBtn');
  const delPosBtn       = $('delPosBtn');
  const exportBtn       = $('exportBtn');
  const importBtn       = $('importBtn');
  const importFile      = $('importFile');
  const importModal     = $('importModal');
  const importInfo      = $('importInfo');
  const importCancel    = $('importCancel');
  const importConfirm   = $('importConfirm');
  const keepStandard    = $('keepStandard');

  const ctxMenu = $('ctxMenu');

  /* ================ COOKIE ================ */
  function setCookie(name, value, days=365){
    const d = new Date(); d.setTime(d.getTime()+days*864e5);
    document.cookie = name+'='+encodeURIComponent(value)+';expires='+d.toUTCString()+';path=/;SameSite=Lax';
  }
  function getCookie(name){
    const m = document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));
    return m ? decodeURIComponent(m[2]) : null;
  }
  function getJSON(name, def){
    const raw = getCookie(name);
    if(!raw) return def;
    try { return JSON.parse(raw); } catch(e){ return def; }
  }
  function setJSON(name, obj){ setCookie(name, JSON.stringify(obj)); }

  /* ================ СТАНДАРТНАЯ ПОЗИЦИЯ ================ */
  const STANDARD_NAME = 'Стандарт';
  const DEFAULT_BLOCKS = {
    barcode: { x: 5,  y: 5,  w: 90, h: 30 },
    qr     : { x: 55, y: 40, w: 40, h: 40 },
    text   : { x: 5,  y: 38, w: 45, h: 12 },
    name   : { x: 5,  y: 82, w: 90, h: 14 }
  };
  const DEFAULT_POSITION = {
    name: STANDARD_NAME,
    barcode: '123456789012',
    format : 'CODE128',
    qr     : 'https://example.com',
    nameText : 'Товар',
    w      : 58,
    h      : 40,
    padding: 2,
    barcodeTextSize: 10,
    nameTextSize: 14,
    /* какие блоки присутствуют на этикетке */
    visible: { barcode:true, qr:true, text:true, name:true },
    blocks : JSON.parse(JSON.stringify(DEFAULT_BLOCKS))
  };

  function makeStandard(){
    return JSON.parse(JSON.stringify(DEFAULT_POSITION));
  }

  /* ================ ХРАНИЛИЩЕ ================ */
  let positions = getJSON('label_positions', null);
  if(!positions || !Array.isArray(positions) || positions.length === 0){
    positions = [ makeStandard() ];
  }
  // Совместимость со старым форматом: enabled -> visible
  positions.forEach(p => {
    if(!p.visible){
      if(p.enabled) p.visible = JSON.parse(JSON.stringify(p.enabled));
      else p.visible = { barcode:true, qr:true, text:true, name:true };
    }
  });
  // Гарантируем наличие «Стандарт»
  if(!positions.find(p => p.name === STANDARD_NAME)){
    positions.unshift(makeStandard());
  }

  let activePositionName = getCookie('label_active_position') || STANDARD_NAME;
  if(!positions.find(p => p.name === activePositionName)){
    activePositionName = positions[0].name;
  }

  function persistPositions(){
    setJSON('label_positions', positions);
    setCookie('label_active_position', activePositionName);
  }

  function getActivePosition(){
    return positions.find(p => p.name === activePositionName) || positions[0];
  }

  /* ================ UI СЕЛЕКТА ================ */
  function renderPositionSelect(){
    positionSelect.innerHTML = '';
    positions.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.name;
      opt.textContent = p.name;
      if(p.name === activePositionName) opt.selected = true;
      positionSelect.appendChild(opt);
    });
    delPosBtn.disabled = (activePositionName === STANDARD_NAME) || positions.length <= 1;
  }

  /* ================ ФОРМА ↔ ПОЗИЦИЯ ================ */
  function loadPositionToForm(pos){
    barcodeInput.value    = pos.barcode;
    barcodeFormat.value   = pos.format;
    qrInput.value         = pos.qr;
    nameInput.value       = pos.nameText;
    labelW.value          = pos.w;
    labelH.value          = pos.h;
    paddingInput.value    = pos.padding;
    barcodeTextSize.value = pos.barcodeTextSize;
    nameTextSize.value    = pos.nameTextSize;

    window.__visible = Object.assign({ barcode:false, qr:false, text:false, name:false }, pos.visible || {});
    window.__blocks  = JSON.parse(JSON.stringify(pos.blocks || DEFAULT_BLOCKS));
    build();
  }

  function collectFormState(){
    return {
      barcode: barcodeInput.value,
      format : barcodeFormat.value,
      qr     : qrInput.value,
      nameText : nameInput.value,
      w      : parseFloat(labelW.value) || 58,
      h      : parseFloat(labelH.value) || 40,
      padding: parseFloat(paddingInput.value) || 0,
      barcodeTextSize: parseInt(barcodeTextSize.value) || 10,
      nameTextSize:    parseInt(nameTextSize.value) || 14,
      visible: JSON.parse(JSON.stringify(window.__visible || {})),
      blocks : JSON.parse(JSON.stringify(window.__blocks || DEFAULT_BLOCKS))
    };
  }

  /* ================ АВТОСОХРАНЕНИЕ ================ */
  let saveTimer = null;
  function autoSave(){
    const idx = positions.findIndex(p => p.name === activePositionName);
    if(idx === -1) return;
    const state = collectFormState();
    positions[idx] = { name: activePositionName, ...state };
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistPositions, 150);
  }
  function saveNow(){
    clearTimeout(saveTimer);
    const idx = positions.findIndex(p => p.name === activePositionName);
    if(idx === -1) return;
    const state = collectFormState();
    positions[idx] = { name: activePositionName, ...state };
    persistPositions();
  }

  /* ================ УТИЛИТЫ ================ */
  const mmToPx = mm => mm * 3.7795275591;
  const clamp  = (v,min,max) => Math.max(min, Math.min(max, v));

  function qrSvg(text){
    const qr = qrcode(0,'M');
    qr.addData(text || ' ');
    qr.make();
    return qr.createSvgTag({ scalable:true, margin:0, cellSize:2 });
  }

  /* ================ СБОРКА ЭТИКЕТКИ ================ */
  function build(){
    const blocks  = window.__blocks  || DEFAULT_BLOCKS;
    const visible = window.__visible || { barcode:false, qr:false, text:false, name:false };

    const wPx  = mmToPx(parseFloat(labelW.value) || 58);
    const hPx  = mmToPx(parseFloat(labelH.value) || 40);
    const padPx= mmToPx(parseFloat(paddingInput.value) || 0);

    const activeKey = labelContainer.querySelector('.draggable.active')?.dataset.key;
    labelContainer.innerHTML = '';

    const labelEl = document.createElement('div');
    labelEl.className = 'label';
    labelEl.style.width  = wPx + 'px';
    labelEl.style.height = hPx + 'px';
    labelEl.style.position = 'relative';
    labelEl.style.boxSizing = 'border-box';

    const inner = document.createElement('div');
    inner.style.position = 'absolute';
    inner.style.left   = padPx + 'px';
    inner.style.top    = padPx + 'px';
    inner.style.right  = padPx + 'px';
    inner.style.bottom = padPx + 'px';
    labelEl.appendChild(inner);

    // Подсказка, если пусто
    const anyVisible = visible.barcode || visible.qr || visible.text || visible.name;
    if(!anyVisible){
      const hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = 'ПКМ по этикетке → добавить элемент';
      labelEl.appendChild(hint);
    }

    /* Штрихкод */
    if(visible.barcode){
      const bc = document.createElement('div');
      bc.className = 'draggable';
      bc.dataset.key = 'barcode';
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      bc.appendChild(svg);
      const h = document.createElement('div'); h.className = 'handle'; bc.appendChild(h);
      try{
        JsBarcode(svg, barcodeInput.value || DEFAULT_POSITION.barcode, {
          format: barcodeFormat.value,
          width: 1.4, height: 60,
          displayValue: false,
          margin: 0, background:'transparent', lineColor:'#000'
        });
        svg.removeAttribute('width');
        svg.removeAttribute('height');
        svg.setAttribute('preserveAspectRatio','none');
      }catch(e){
        bc.textContent = 'Ошибка ШК: '+e.message;
      }
      inner.appendChild(bc);
    }

    /* QR */
    if(visible.qr){
      const qr = document.createElement('div');
      qr.className = 'draggable';
      qr.dataset.key = 'qr';
      qr.innerHTML = qrSvg(qrInput.value);
      const s = qr.querySelector('svg');
      if(s){ s.removeAttribute('width'); s.removeAttribute('height');
             s.setAttribute('preserveAspectRatio','xMidYMid meet'); }
      const h = document.createElement('div'); h.className='handle'; qr.appendChild(h);
      inner.appendChild(qr);
    }

    /* Номер */
    if(visible.text){
      const tx = document.createElement('div');
      tx.className = 'draggable';
      tx.dataset.key = 'text';
      const t = document.createElement('div');
      t.className='text';
      t.textContent = barcodeInput.value;
      tx.appendChild(t);
      const h = document.createElement('div'); h.className='handle'; tx.appendChild(h);
      inner.appendChild(tx);
    }

    /* Название */
    if(visible.name){
      const nm = document.createElement('div');
      nm.className = 'draggable';
      nm.dataset.key = 'name';
      const t = document.createElement('div');
      t.className = 'text';
      t.style.fontWeight = '700';
      t.textContent = nameInput.value || '';
      nm.appendChild(t);
      const h = document.createElement('div'); h.className='handle'; nm.appendChild(h);
      inner.appendChild(nm);
    }

    inner.querySelectorAll('.draggable').forEach(el => {
      const key = el.dataset.key;
      const b = blocks[key] || DEFAULT_BLOCKS[key];
      el.style.position='absolute';
      el.style.left   = b.x + '%';
      el.style.top    = b.y + '%';
      el.style.width  = b.w + '%';
      el.style.height = b.h + '%';

      const textEl = el.querySelector('.text');
      if(textEl){
        const size = key === 'name' ? (nameTextSize.value||14) : (barcodeTextSize.value||10);
        textEl.style.fontSize = size + 'px';
      }
    });

    if(activeKey){
      const el = inner.querySelector('.draggable[data-key="'+activeKey+'"]');
      if(el) el.classList.add('active');
    }

    attachInteractions(inner);
    attachContextMenu(inner, labelEl);
    labelContainer.appendChild(labelEl);
  }

  /* ================ DRAG & RESIZE ================ */
  function attachInteractions(inner){
    inner.querySelectorAll('.draggable').forEach(el => {
      el.addEventListener('pointerdown', onDown);
    });

    function selectOnly(el){
      inner.querySelectorAll('.draggable').forEach(d=>d.classList.remove('active'));
      el.classList.add('active');
    }

    function onDown(e){
      if(e.button !== 0) return; // только ЛКМ
      const el = e.currentTarget;
      selectOnly(el);
      if(e.target.classList.contains('handle')) startResize(e, el);
      else startDrag(e, el);
    }

    function startDrag(e, el){
      e.preventDefault();
      const key = el.dataset.key;
      const b = window.__blocks[key];
      const rect = inner.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const l0 = b.x, t0 = b.y;

      function move(ev){
        b.x = clamp(l0 + (ev.clientX - sx)/rect.width  * 100, 0, 100 - b.w);
        b.y = clamp(t0 + (ev.clientY - sy)/rect.height * 100, 0, 100 - b.h);
        el.style.left = b.x+'%';
        el.style.top  = b.y+'%';
      }
      function up(){
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        autoSave();
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }

    function startResize(e, el){
      e.preventDefault(); e.stopPropagation();
      const key = el.dataset.key;
      const b = window.__blocks[key];
      const rect = inner.getBoundingClientRect();
      const sx = e.clientX, sy = e.clientY;
      const w0 = b.w, h0 = b.h;

      function move(ev){
        b.w = clamp(w0 + (ev.clientX - sx)/rect.width  * 100, 5, 100 - b.x);
        b.h = clamp(h0 + (ev.clientY - sy)/rect.height * 100, 5, 100 - b.y);
        el.style.width  = b.w + '%';
        el.style.height = b.h + '%';
      }
      function up(){
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        autoSave();
      }
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    }
  }

  /* ================ КОНТЕКСТНОЕ МЕНЮ ================ */
  const LABELS = {
    barcode: 'Штрихкод',
    qr:      'QR-код',
    text:    'Номер',
    name:    'Название'
  };

  let ctxContext = null; // { type:'empty'|'item', key }

  function hideCtx(){
    ctxMenu.classList.remove('show');
    ctxContext = null;
  }

  function showCtx(x, y, html){
    ctxMenu.innerHTML = html;
    ctxMenu.style.left = x + 'px';
    ctxMenu.style.top  = y + 'px';
    ctxMenu.classList.add('show');

    // не выйти за экран
    const r = ctxMenu.getBoundingClientRect();
    if(r.right > innerWidth)   ctxMenu.style.left = (innerWidth - r.width - 8) + 'px';
    if(r.bottom > innerHeight) ctxMenu.style.top  = (innerHeight - r.height - 8) + 'px';
  }

  function buildEmptyMenu(){
    const visible = window.__visible || {};
    let html = '<div class="title">Добавить элемент</div>';
    ['barcode','qr','text','name'].forEach(key => {
      const has = !!visible[key];
      html += '<div class="item' + (has ? ' disabled' : '') + '" data-add="'+key+'">'
            + (has ? '✓ ' : '+ ') + LABELS[key]
            + (has ? ' <small style="color:#b0b7c0">(уже есть)</small>' : '')
            + '</div>';
    });
    return html;
  }

  function buildItemMenu(key){
    return '<div class="title">'+LABELS[key]+'</div>'
         + '<div class="item" data-del="'+key+'">🗑 Удалить</div>';
  }

  function attachContextMenu(inner, labelEl){
    // ПКМ по этикетке
    labelEl.addEventListener('contextmenu', e => {
      e.preventDefault();

      const itemEl = e.target.closest('.draggable');
      if(itemEl){
        // ПКМ по элементу — меню удаления
        ctxContext = { type:'item', key: itemEl.dataset.key };
        showCtx(e.clientX, e.clientY, buildItemMenu(itemEl.dataset.key));
      }else{
        // ПКМ по пустому месту — меню добавления
        ctxContext = { type:'empty' };
        showCtx(e.clientX, e.clientY, buildEmptyMenu());
      }
    });
  }

  ctxMenu.addEventListener('click', e => {
    const addEl = e.target.closest('[data-add]');
    const delEl = e.target.closest('[data-del]');

    if(addEl){
      if(addEl.classList.contains('disabled')){ hideCtx(); return; }
      const key = addEl.dataset.add;
      addElement(key);
      hideCtx();
    }
    else if(delEl){
      const key = delEl.dataset.del;
      removeElement(key);
      hideCtx();
    }
  });

  document.addEventListener('pointerdown', e => {
    if(!ctxMenu.contains(e.target)) hideCtx();
  });
  window.addEventListener('blur', hideCtx);

  function addElement(key){
    window.__visible[key] = true;
    autoSave();
    build();
  }

  function removeElement(key){
    window.__visible[key] = false;
    // активный блок мог быть удалён — снимем выделение
    const active = labelContainer.querySelector('.draggable.active');
    if(active && active.dataset.key === key) active.classList.remove('active');
    autoSave();
    build();
  }

  /* ================ СОБЫТИЯ ФОРМЫ ================ */
  function onFormChange(){ autoSave(); build(); }

  barcodeInput.addEventListener('input', onFormChange);
  qrInput.addEventListener('input',      onFormChange);
  nameInput.addEventListener('input',    onFormChange);
  barcodeFormat.addEventListener('change', onFormChange);
  labelW.addEventListener('input',       onFormChange);
  labelH.addEventListener('input',       onFormChange);
  paddingInput.addEventListener('input', onFormChange);
  barcodeTextSize.addEventListener('input', onFormChange);
  nameTextSize.addEventListener('input',    onFormChange);

  printBtn.addEventListener('click', () => window.print());

  resetBtn.addEventListener('click', () => {
    window.__blocks = JSON.parse(JSON.stringify(DEFAULT_BLOCKS));
    autoSave(); build();
  });

  /* ================ УПРАВЛЕНИЕ ПОЗИЦИЯМИ ================ */
  positionSelect.addEventListener('change', () => {
    saveNow();
    activePositionName = positionSelect.value;
    persistPositions();
    renderPositionSelect();
    loadPositionToForm(getActivePosition());
  });

  savePosBtn.addEventListener('click', () => {
    saveNow();
    const old = savePosBtn.textContent;
    savePosBtn.textContent = '✓ Сохранено';
    savePosBtn.disabled = true;
    setTimeout(()=>{ savePosBtn.textContent = old; savePosBtn.disabled = false; }, 1000);
  });

  newPosBtn.addEventListener('click', () => {
    const name = prompt('Название новой позиции:', 'Позиция ' + (positions.length+1));
    if(!name) return;
    const trimmed = name.trim();
    if(!trimmed) return;
    if(positions.find(p => p.name === trimmed)){
      alert('Позиция с таким именем уже существует.');
      return;
    }
    const state = collectFormState();
    positions.push({ name: trimmed, ...state });
    activePositionName = trimmed;
    persistPositions();
    renderPositionSelect();
    build();
  });

  delPosBtn.addEventListener('click', () => {
    if(activePositionName === STANDARD_NAME){
      alert('Позицию «Стандарт» удалить нельзя.');
      return;
    }
    if(positions.length <= 1) return;
    if(!confirm('Удалить позицию «'+activePositionName+'»?')) return;
    positions = positions.filter(p => p.name !== activePositionName);
    activePositionName = positions[0].name;
    persistPositions();
    renderPositionSelect();
    loadPositionToForm(getActivePosition());
  });

  /* ================ ЭКСПОРТ ================ */
  exportBtn.addEventListener('click', () => {
    saveNow();
    const data = {
      version: 2,
      exportedAt: new Date().toISOString(),
      active: activePositionName,
      positions: positions
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'positions.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* ================ ИМПОРТ ================ */
  let pendingImport = null;

  importBtn.addEventListener('click', () => importFile.click());

  importFile.addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const data = JSON.parse(ev.target.result);
        const list = Array.isArray(data) ? data : data.positions;
        if(!Array.isArray(list) || list.length === 0){
          alert('В файле нет позиций.'); return;
        }
        for(const p of list){
          if(!p.name || typeof p.name !== 'string'){
            alert('У позиции нет корректного поля name.'); return;
          }
          // совместимость enabled -> visible
          if(!p.visible){
            p.visible = p.enabled ? JSON.parse(JSON.stringify(p.enabled))
                                  : { barcode:true, qr:true, text:true, name:true };
          }
        }
        pendingImport = { list, active: data.active || null };
        const names = list.map(p => '«'+p.name+'»').join(', ');
        importInfo.textContent =
          'В файле: ' + list.length + ' поз.: ' + names + '. ' +
          'Сейчас в браузере: ' + positions.length + ' поз.';
        keepStandard.checked = true;
        document.querySelector('input[name=importMode][value=merge]').checked = true;
        importModal.classList.add('show');
      }catch(err){
        alert('Ошибка чтения JSON: ' + err.message);
      }finally{
        importFile.value = '';
      }
    };
    reader.readAsText(file);
  });

  importCancel.addEventListener('click', () => {
    importModal.classList.remove('show');
    pendingImport = null;
  });

  importConfirm.addEventListener('click', () => {
    if(!pendingImport) return;
    const mode = document.querySelector('input[name=importMode]:checked').value;
    const keepStd = keepStandard.checked;
    const incoming = JSON.parse(JSON.stringify(pendingImport.list));
    const stdInIncoming = incoming.find(p => p.name === STANDARD_NAME);

    if(mode === 'replace'){
      let newList = incoming;
      if(keepStd && !stdInIncoming){
        const localStd = positions.find(p => p.name === STANDARD_NAME) || makeStandard();
        newList = [ JSON.parse(JSON.stringify(localStd)), ...incoming ];
      }
      positions = newList;
    }
    else if(mode === 'update'){
      const map = new Map(positions.map(p => [p.name, p]));
      incoming.forEach(p => map.set(p.name, p));
      positions = Array.from(map.values());
      if(keepStd && !stdInIncoming && !positions.find(p => p.name === STANDARD_NAME)){
        positions.unshift(makeStandard());
      }
    }
    else { // merge
      const existing = new Set(positions.map(p => p.name));
      incoming.forEach(p => {
        if(!existing.has(p.name)){
          positions.push(p);
          existing.add(p.name);
        }
      });
      if(keepStd && !positions.find(p => p.name === STANDARD_NAME)){
        positions.unshift(makeStandard());
      }
    }

    let desired = pendingImport.active;
    if(!desired || !positions.find(p => p.name === desired)){
      desired = positions[0].name;
    }
    activePositionName = desired;

    persistPositions();
    renderPositionSelect();
    loadPositionToForm(getActivePosition());

    importModal.classList.remove('show');
    alert('Импорт завершён. Позиций: ' + positions.length);
    pendingImport = null;
  });

  /* ================ СТАРТ ================ */
  renderPositionSelect();
  loadPositionToForm(getActivePosition());
})();
</script>
</body>
</html>
