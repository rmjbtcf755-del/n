<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1b1e;color:#e6e6e6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none}
  #map{display:block;width:100vw;height:100vh;background:#1a1b1e;cursor:default;touch-action:none}
  #map.dragging{cursor:grabbing}
  #map.marquee{cursor:crosshair}
  button,select,input{font:inherit;color:#e6e6e6}
  .bar{
    position:fixed;z-index:20;top:10px;left:10px;right:10px;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    min-height:48px;padding:6px 8px 6px 14px;
    background:rgba(32,33,36,.94);
    border:1px solid #3a3b40;border-radius:12px;
    backdrop-filter:blur(10px);
    user-select:none;
  }
  .brand{font-weight:600;font-size:14px;margin-right:4px}
  .sep{width:1px;height:18px;background:#3a3b40;margin:0 2px}
  .spacer{flex:1;min-width:8px}
  .status{font-size:12px;color:#9a9aa3;white-space:nowrap}
  .btn{
    width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;border-radius:8px;cursor:pointer;padding:0;color:#e6e6e6;
  }
  .btn:hover{background:#2e2f34}
  .btn:disabled{opacity:.28;cursor:default}
  .btn:disabled:hover{background:transparent}
  .ico{width:20px;height:20px;fill:currentColor;display:block}
  select,input[type=date],.dialog input{
    height:32px;border:1px solid #3a3b40;border-radius:8px;background:#26272b;padding:0 8px;font-size:13px;outline:none;
  }
  select:focus,input:focus{border-color:#c8c8c8}
  .dialog{
    position:fixed;z-index:30;top:64px;left:12px;
    display:flex;align-items:center;gap:8px;
    background:#26272b;border:1px solid #3a3b40;border-radius:12px;
    padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  .dialog[hidden],#periodDate[hidden],#period[hidden],#detail[hidden],#pick[hidden],#flowLegend[hidden]{display:none !important}
  .dialog-label{font-size:12px;color:#b0b0b6;white-space:nowrap}
  .dialog input{width:220px}
  .textbtn{height:32px;padding:0 12px;border:none;border-radius:8px;background:#e6e6e6;color:#1a1b1e;font-size:13px;cursor:pointer}
  .textbtn:hover{background:#fff}
  #detail{
    position:fixed;z-index:15;left:12px;bottom:12px;width:320px;
    max-height:min(440px,48vh);overflow:auto;
    background:#26272b;border:1px solid #3a3b40;border-radius:12px;
    padding:12px 14px;font-size:12.5px;line-height:1.4;
  }
  #detail h3{margin:0 0 4px;font-size:14px;font-weight:600}
  .route-hit{color:#3dcf8e;font-weight:700}
  #detail .sub{color:#a3a3ab;margin-bottom:8px}
  #detail .mv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid #35363b}
  #detail .empty{color:#8d8d96}
  .tip{
    position:fixed;z-index:50;pointer-events:none;
    background:#26272b;color:#e6e6e6;border:1px solid #3a3b40;border-radius:8px;
    padding:7px 10px;font-size:12px;line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;white-space:normal;max-width:360px;
  }
  .toast{
    position:fixed;z-index:70;left:50%;bottom:16px;transform:translateX(-50%);
    background:#e6e6e6;color:#1a1b1e;border-radius:8px;padding:8px 14px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1}
  .meta{color:#a3a3ab;font-size:12px;font-weight:400}
  .modes{display:inline-flex;border:1px solid #3a3b40;border-radius:8px;overflow:hidden}
  .mode{
    height:32px;padding:0 10px;border:none;background:transparent;color:#c8c8ce;cursor:pointer;font-size:13px;
  }
  .mode.on{background:#e6e6e6;color:#1a1b1e;font-weight:600}
  #search{
    height:32px;min-width:0;flex:1 1 220px;max-width:460px;
    border:1px solid #3a3b40;border-radius:8px;background:#26272b;padding:0 10px;font-size:13px;outline:none;
  }
  #search:focus{border-color:#c8c8c8}
  #pick{
    position:fixed;z-index:18;top:64px;right:12px;width:min(400px,calc(100vw - 24px));
    max-height:min(70vh,640px);overflow:auto;
    background:#26272b;border:1px solid #3a3b40;border-radius:12px;
    padding:12px 14px;font-size:13px;line-height:1.35;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  #pick h3{margin:0 0 4px;font-size:14px}
  #pick .sub{color:#a3a3ab;margin-bottom:8px}
  #pick .prod{margin-top:10px}
  #pick .prod-h{font-weight:600;cursor:pointer}
  #pick .prod-h:hover{color:#fff}
  #pick .meta{color:#a3a3ab;font-size:12px;font-weight:400}
  .pick-row{
    display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;
    min-height:44px;padding:4px 0;border-top:1px solid #35363b;cursor:pointer;
  }
  .pick-row .rk{
    width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    background:#1a1b1e;font-size:12px;font-weight:700;
  }
  .pick-row .where{font-weight:600}
  .pick-row .off{color:#e0b15a;font-size:12px}
  .pick-row .q{font-weight:700;white-space:nowrap}
  .linkbtn{
    height:32px;padding:0 10px;border:none;border-radius:8px;background:#3a3b40;color:#e6e6e6;cursor:pointer;font-size:12px;
  }
  .linkbtn:hover{background:#4a4b52}
  .flowleg{
    display:inline-flex;align-items:center;gap:12px;height:32px;padding:0 12px;
    border:1px solid #3a3b40;border-radius:8px;font-size:12px;color:#d7d7de;white-space:nowrap;
    background:#1e1f23;
  }
  .flowleg b{font-weight:650;color:#f4f4f5}
  .fkey{display:inline-flex;align-items:center;gap:6px}
  .fline{
    width:34px;height:10px;position:relative;flex:none;color:#3dcf8e;
  }
  .fline::before{
    content:"";position:absolute;left:0;top:1px;width:8px;height:8px;border-radius:99px;background:currentColor;
  }
  .fline i{
    position:absolute;left:6px;right:7px;top:4px;height:3px;border-radius:99px;background:currentColor;
  }
  .fline::after{
    content:"";position:absolute;right:0;top:0;
    border:5px solid transparent;border-left:8px solid currentColor;
  }
  .fline.in{color:#3dcf8e}
  .fline.move{color:#4c8dff}
  .fline.out{
    width:auto;min-width:22px;height:18px;padding:0 7px;border-radius:99px;
    background:#c62828;color:#fff;font-size:12px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .fline.out::before,.fline.out::after,.fline.out i{display:none}
  .route-legend{
    display:grid;grid-template-columns:auto minmax(48px,1fr) auto;gap:8px;align-items:center;
    margin:2px 0 10px;
  }
  .route-end{display:flex;align-items:center;gap:8px;min-width:0}
  .route-end b{display:block;font-size:12px;line-height:1.2}
  .route-end .rk{
    width:24px;height:24px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;flex:none;
  }
  .route-track{
    height:8px;border-radius:99px;
    background:linear-gradient(90deg,#3ecf8e 0%,#efe07a 55%,#ff7a1a 100%);
    position:relative;
  }
  .route-track::after{
    content:"";position:absolute;right:-1px;top:50%;transform:translateY(-50%);
    border:6px solid transparent;border-left:9px solid #ff7a1a;
  }
  @media (max-width:800px){
    #search{font-size:16px;max-width:none}
    #side{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:40vh}
    #pick{top:auto;bottom:calc(40vh + 16px);left:8px;right:8px;width:auto;max-height:28vh}
    #detail{left:8px;right:8px;width:auto;bottom:calc(40vh + 16px)}
  }

  #map.placing{cursor:crosshair}
  .btn.on{background:#e23b3b;color:#fff}
  .tip{white-space:normal;max-width:360px}
  #side{
    position:fixed;z-index:17;top:64px;right:10px;bottom:10px;width:340px;
    display:flex;flex-direction:column;
    background:#26272b;border:1px solid #3a3b40;border-radius:12px;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  #side .tabs{display:flex;flex:none;border-bottom:1px solid #3a3b40}
  #side .tab{
    flex:1;height:36px;border:none;background:transparent;color:#c8c8ce;cursor:pointer;font-size:12px;
  }
  #side .tab.on{background:#e6e6e6;color:#1a1b1e;font-weight:700}
  #sideBody{overflow:auto;padding:10px 12px 16px;font-size:12.5px;line-height:1.35}
  #sideBody .sub{color:#a3a3ab;margin:0 0 8px}
  #sideBody .empty{color:#8d8d96}
  #sideBody .meta{color:#a3a3ab;font-size:12px}
  #sideBody .neg{color:#ffb020}
  #sideBody .off{color:#e0b15a}
  #sideBody .reason{color:#f0d59a;margin-top:2px}
  .side-row{padding:7px 0;border-top:1px solid #35363b}
  .chip{
    display:inline-block;margin:4px 4px 0 0;padding:2px 7px;border-radius:99px;
    background:#1a1b1e;cursor:pointer;font-size:12px;
  }
  .chip.off{outline:1px dashed #e0b15a;color:#e0b15a}
  #pick{right:362px}
  body.side-closed #pick{right:12px}
  .layerbtn{
    height:32px;padding:0 10px;border:1px solid #3a3b40;border-radius:8px;
    background:transparent;color:#c8c8ce;cursor:pointer;font-size:13px;white-space:nowrap;
  }
  .layerbtn.on{background:#3a2424;color:#ffb4b4;border-color:#8a3b3b}
  .side-top{display:flex;align-items:flex-start;gap:4px}
  #sideClose{flex:none;margin:8px 6px 0 0}
  .facts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 8px 0;flex:1}
  .fact{
    border:none;border-radius:99px;background:#1a1b1e;color:#e6e6e6;
    min-height:28px;padding:4px 10px;cursor:pointer;font-size:12px;text-align:left;
  }
  .fact.warn{color:#ffb020}
  .fact.miss{color:#e0b15a}
  #side.is-closed{display:none}
  #sideOpen{
    position:fixed;z-index:17;top:64px;right:10px;height:40px;padding:0 14px;
    border:none;border-radius:10px;background:#e6e6e6;color:#1a1b1e;font-weight:700;cursor:pointer;
  }
  #sideOpen[hidden]{display:none !important}
  .route{font-weight:700;margin-top:2px}
  @media (max-width:800px){
    .bar{top:6px;left:6px;right:6px;padding:6px}
    .mode,.layerbtn{height:36px}
    .flowleg{display:none !important}
    #side{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:min(46vh,420px)}
    #sideOpen{top:auto;left:8px;right:8px;bottom:8px;height:44px}
    #pick{right:8px}
    body.side-closed #pick{bottom:60px}
    #detail{max-height:32vh}
    .status{white-space:normal}
  }
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="bar">
  <div class="brand">Склад</div>
  <div class="modes" role="group" aria-label="Режим">
    <button type="button" id="modeStock" class="mode on">Остатки</button>
    <button type="button" id="modeMove" class="mode">Движение</button>
    <button type="button" id="modeAudit" class="mode">Проверка</button>
  </div>
  <button type="button" class="layerbtn" id="camLayer" title="Камеры в этом режиме карты">Камеры</button>
  <div id="flowLegend" class="flowleg" hidden>
    <b id="flowTitle">Движение загружено</b>
    <span class="fkey"><i class="fline in"><i></i></i>Приход</span>
    <span class="fkey"><i class="fline move"><i></i></i>Перемещение</span>
    <span class="fkey"><i class="fline out">−</i>Расход</span>
  </div>
  <input id="search" type="search" placeholder="Что ищем: штрихкод, артикул, название" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Что ищем">
  <select id="period" title="Период движений">
    <option value="all">Всё время</option>
    <option value="today">Сегодня</option>
    <option value="yesterday">Вчера</option>
    <option value="7">7 дней</option>
    <option value="30">30 дней</option>
    <option value="day">Дата</option>
  </select>
  <input type="date" id="periodDate" title="День" hidden>
  <span class="sep"></span>
  <button type="button" class="btn" id="addCell" title="Добавить ячейку" aria-label="Добавить ячейку"><svg class="ico" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>
  <button type="button" class="btn" id="renameCell" title="Задать адрес" aria-label="Задать адрес"><svg class="ico" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 0 0 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
  <button type="button" class="btn" id="deleteCell" title="Удалить ячейки" aria-label="Удалить ячейки"><svg class="ico" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
  <button type="button" class="btn" id="pinCell" title="Закрепить" aria-label="Закрепить"><svg class="ico" viewBox="0 0 24 24"><path d="M16 9V4h1V2H7v2h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>
  <button type="button" class="btn" id="addCamera" title="Поставить камеру" aria-label="Поставить камеру"><svg class="ico" viewBox="0 0 24 24"><path d="M9 4l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1l2-2h0zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg></button>
  <button type="button" class="btn" id="addZone" title="Поставить красную зону" aria-label="Поставить зону"><svg class="ico" viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg></button>
  <span class="sep"></span>
  <button type="button" class="btn" id="printMinus" title="Печать минусов на A4" aria-label="Печать минусов"><svg class="ico" viewBox="0 0 24 24"><path d="M19 8H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3zm-3 11H8v-5h8v5zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-1-9H6v4h12V3z"/></svg></button>
  <button type="button" class="btn" id="saveAll" title="Скачать изменения" aria-label="Скачать изменения"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></button>
  <button type="button" class="btn" id="loadBtn" title="Загрузить остатки, движения или карту" aria-label="Загрузить"><svg class="ico" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg></button>
  <input type="file" id="loadFile" accept=".json,.xls,.xlsx,application/json" hidden>
  <div class="spacer"></div>
  <div class="status" id="status"></div>
  <button type="button" class="btn" id="zoomOut" title="Отдалить" aria-label="Отдалить"><svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg></button>
  <button type="button" class="btn" id="zoomIn" title="Приблизить" aria-label="Приблизить"><svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2z"/></svg></button>
  <button type="button" class="btn" id="fitBtn" title="Показать всё" aria-label="Показать всё"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16h12V8H6v8zm2-6h8v4H8v-4zM7 3H3v4h2V5h2V3zm14 0h-4v2h2v2h2V3zM5 15H3v4h4v-2H5v-2zm16 0h-2v2h-2v2h4v-4z"/></svg></button>
</div>

<form class="dialog" id="dialog" hidden>
  <div class="dialog-label" id="dialogLabel">Адрес ячейки</div>
  <input id="cellAddr" type="text" placeholder="Например, B12-01" autocomplete="off" spellcheck="false">
  <button type="submit" class="textbtn">Готово</button>
  <button type="button" class="btn" id="dialogCancel" title="Закрыть" aria-label="Закрыть"><svg class="ico" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
</form>
<aside id="detail" hidden></aside>
<aside id="pick" hidden></aside>
<aside id="side">
  <div class="side-top">
    <div id="sideFacts" class="facts"></div>
    <button type="button" class="btn" id="sideClose" title="Свернуть панель" aria-label="Свернуть панель"><svg class="ico" viewBox="0 0 24 24"><path d="M8.6 16.6 13.2 12 8.6 7.4 10 6l6 6-6 6z"/></svg></button>
  </div>
  <div class="tabs">
    <button type="button" class="tab on" data-tab="report">Отчёт</button>
    <button type="button" class="tab" data-tab="moves">Движения</button>
    <button type="button" class="tab" data-tab="audit">Проверка</button>
  </div>
  <div id="sideBody"></div>
</aside>
<button type="button" id="sideOpen" hidden>Данные</button>

<script src="layout.js"></script>
<script src="stock.js"></script>
<script src="movements.js"></script>
<script>

const $ = s => document.querySelector(s);
const canvas = $('#map');
const tip = $('#tip');

/* ================================================================
   ДЕФОЛТНЫЙ СПИСОК ЯЧЕЕК
   ================================================================ */
const DEFAULT_CELLS = `

function parseCell(code){
  const s = String(code||'').trim();
  let m = s.match(/^([A-Za-zА-Яа-я]+)(\d+)-(\d+)-(\d+)$/);
  if (m){
    const line = m[1].toUpperCase() + m[2] + '-' + m[3];
    return {line, slot:+m[4], special:false, raw:s};
  }
  m = s.match(/^([A-Za-zА-Яа-я]+)(\d+)(?:\/(\d+))?-(\d+)$/);
  if (m){
    const line = m[1].toUpperCase() + m[2] + (m[3] ? '/'+m[3] : '');
    return {line, slot: +m[4], special: false, raw: s};
  }
  m = s.match(/^([A-Za-zА-Яа-я]+)(\d+)$/);
  if (m) return {line: 'Спец', slot: 0, special: true, raw: s};
  m = s.match(/^ПМ-(\d+)-(\d+)$/);
  if (m) return {line: 'Паллеты L'+m[1], slot: +m[2], special: false, raw: s};
  return {line: 'Прочее', slot: 0, special: true, raw: s};
}

function cellStats(cell){
  let inQ=0, outQ=0, end=0, ops=0;
  STATE.items.forEach(x=>{
    if (x.cell !== cell) return;
    inQ += x.qIn; outQ += x.qOut; ops++; end = x.qEnd;
  });
  return {inQ, outQ, end, ops};
}

function lineOfCell(cell){
  const p = parseCell(cell);
  return p.special ? 'Спец/Прочее' : p.line;
}

const IN_NODE = 'Приход', OUT_NODE = 'Расход';

function buildFlow(items){
  const map = new Map();
  items.forEach(x=>{
    if (!map.has(x.reg)) map.set(x.reg, {reg:x.reg, date:x.date, type:x.type, moves:[]});
    const g = map.get(x.reg);
    g.moves.push({cell:x.cell, in:x.qIn, out:x.qOut, name:x.name || '', article:x.article || '', barcode:x.barcode || ''});
    if (x.type==='in') g.type='in';
    else if (x.type==='out' && g.type!=='in') g.type='out';
  });
  const arr = [...map.values()].sort((a,b)=>{
    const da = a.date ? a.date.d.split('.').reverse().join('')+a.date.t : '';
    const db = b.date ? b.date.d.split('.').reverse().join('')+b.date.t : '';
    return da.localeCompare(db);
  });
  const edges = [];
  arr.forEach(g=>{
    const outs = g.moves.filter(m=>m.out>0 && m.cell);
    const ins = g.moves.filter(m=>m.in>0 && m.cell);
    const qty = Math.max(0, ...g.moves.map(m=>Math.max(m.in,m.out)));
    if (outs.length && ins.length){
      if (outs.length===1 && ins.length===1){
        edges.push({from: outs[0].cell, to: ins[0].cell, qty:Math.max(outs[0].out, ins[0].in),
                    type:'move', reg:g.reg, date:g.date, name:outs[0].name || ins[0].name || '',
                    article:outs[0].article || ins[0].article || '', barcode:outs[0].barcode || ins[0].barcode || ''});
      } else {
        const per = qty / Math.max(1, Math.min(outs.length, ins.length));
        outs.forEach(o => ins.forEach(i2 => {
          edges.push({from: o.cell, to: i2.cell, qty:Math.round(per)||1,
                      type:'move', reg:g.reg, date:g.date, name:o.name || i2.name || '',
                      article:o.article || i2.article || '', barcode:o.barcode || i2.barcode || ''});
        }));
      }
    } else if (outs.length){
      outs.forEach(o => edges.push({from: o.cell, to: OUT_NODE, qty:o.out, type:'out', reg:g.reg, date:g.date, name:o.name || '', article:o.article || '', barcode:o.barcode || ''}));
    } else if (ins.length){
      ins.forEach(i2 => edges.push({from: IN_NODE, to: i2.cell, qty:i2.in, type:'in', reg:g.reg, date:g.date, name:i2.name || '', article:i2.article || '', barcode:i2.barcode || ''}));
    }
  });
  return edges;
}

function extractDate(reg){
  const m = String(reg || '').match(/(\d{2}\.\d{2}\.\d{4})(?:\s+(\d{1,2}:\d{2}(?::\d{2})?))?/);
  if (!m) return null;
  let t = '';
  if (m[2]){
    const p = m[2].split(':');
    if (p.length === 2) p.push('00');
    t = p.map(x => x.padStart(2, '0')).join(':');
  }
  return {d:m[1], t};
}

/* ================================================================
   НОРМАЛИЗАЦИЯ
   ================================================================ */
function cleanCell(v){
  return (v ?? '').toString()
    .replace(/\u00A0/g, ' ')
    .replace(/\u2007/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function norm(v){ return cleanCell(v); }
function num(v){
  if (v === null || v === undefined) return 0;
  const s = String(v)
    .replace(/\u00A0/g,' ')
    .replace(/\s+/g,'')
    .replace(',', '.')
    .replace(/[^\d.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

const HEADER_WORDS = ['ячейка','регистратор'];
function isHeaderRow(row){
  const cells = row.map(v => cleanCell(v).toLowerCase());
  return HEADER_WORDS.every(w => cells.some(c => c === w));
}
function findHeaderRow(rows){
  for (let i=0;i<rows.length;i++){
    if (isHeaderRow(rows[i] || [])) return i;
  }
  return -1;
}
function findCol(header, ...names){
  const nh = header.map(v => cleanCell(v).toLowerCase().replace(/\s+/g,' '));
  for (const name of names){
    const n = name.toLowerCase().replace(/\s+/g,' ');
    const i = nh.indexOf(n); if (i >= 0) return i;
  }
  for (const name of names){
    const n = name.toLowerCase().replace(/\s+/g,' ');
    const i = nh.findIndex(h => h.includes(n)); if (i >= 0) return i;
  }
  return -1;
}

function isServiceRow(cells){
  const first = cleanCell(cells[0] || '');
  const joined = cells.map(cleanCell).join(' ').toLowerCase();
  if (!first && cells.every(c => !cleanCell(c))) return true;
  if (/^отбор\s*:/i.test(first)) return true;
  if (/^контрагент$/i.test(first)) return true;
  if (/^артикул$/i.test(first)) return true;
  if (/^склад$/i.test(first)) return true;
  if (/^ооо\s+"/i.test(first)) return true;
  if (/^\d{4}-\d+/.test(first) && /утяжел|номенклатура/i.test(joined)) return true;
  if (/^склад\s+ижорский$/i.test(first)) return true;
  return false;
}

function movementScale(items){
  const vals = [];
  items.forEach(it => ['qIn', 'qOut', 'qStart', 'qEnd'].forEach(k => { if (it[k]) vals.push(it[k]); }));
  if (vals.length < 2) return 1;
  if (!vals.every(v => Math.abs(v - Math.round(v)) < 1e-6)) return 1;
  if (!vals.every(v => Math.abs(Math.round(v)) % 1000 === 0)) return 1;
  if (Math.min(...vals.map(v => Math.abs(v))) < 1000) return 1;
  return 1000;
}
function parseMovement(rows){
  const headerIdx = findHeaderRow(rows);
  if (headerIdx < 0) return {error:'Не найдена строка заголовков («Ячейка» и «Регистратор»).'};
  const header = rows[headerIdx] || [];
  const idx = {
    cell:  findCol(header, 'Ячейка'),
    reg:   findCol(header, 'Регистратор'),
    start: findCol(header, 'Количество Начальный остаток', 'Начальный остаток'),
    in:    findCol(header, 'Количество Приход', 'Приход'),
    out:   findCol(header, 'Количество Расход', 'Расход'),
    end:   findCol(header, 'Количество Конечный остаток', 'Конечный остаток'),
    barcode: findCol(header, 'Штрихкод'),
    volume: findCol(header, 'Объем м3', 'Объём м3'),
  };
  if (idx.cell < 0 || idx.reg < 0) return {error:'В заголовке нет колонок «Ячейка» / «Регистратор».'};

  const items = [];
  let contractor = '', article = '', name = '', warehouse = '';
  for (let i = headerIdx + 1; i < rows.length; i++){
    const r = rows[i] || [];
    if (r.every(c => !cleanCell(c))) continue;
    const reg = cleanCell(r[idx.reg]);
    const cell = cleanCell(r[idx.cell]);
    if (!reg){
      const head = cleanCell(r[0]);
      const nom = cleanCell(r[3]);
      if (!head) continue;
      if (/^отбор\s*:/i.test(head)) continue;
      if (/^склад(?:\s|$)/i.test(head)){ warehouse = head; continue; }
      if (nom){ article = head; name = nom; continue; }
      contractor = head;
      continue;
    }
    if (!cell) continue;
    if (!/\d{2}\.\d{2}\.\d{4}/.test(reg) && !/^(поступлен|лист подбора|комплектац|перемещен|списан|реализац)/i.test(reg)) continue;

    let type = 'move';
    if (/поступлен/i.test(reg)) type = 'in';
    else if (/комплектац|списан|реализац/i.test(reg)) type = 'out';
    else if (/перемещен|лист подбора/i.test(reg)) type = 'move';
    const docType = (reg.match(/^(.+?)\s+\d/) || [, reg.split(' ')[0] || reg])[1];

    items.push({
      reg, docType, cell, type,
      name, article, warehouse, contractor,
      barcode: idx.barcode >= 0 ? asBarcode(r[idx.barcode]) : '',
      volume: idx.volume >= 0 ? num(r[idx.volume]) : 0,
      qIn:    idx.in    >= 0 ? num(r[idx.in])    : 0,
      qOut:   idx.out   >= 0 ? num(r[idx.out])   : 0,
      qStart: idx.start >= 0 ? num(r[idx.start]) : 0,
      qEnd:   idx.end   >= 0 ? num(r[idx.end])   : 0,
      date: extractDate(reg),
    });
  }
  const scale = movementScale(items);
  if (scale > 1){
    items.forEach(it => {
      it.qIn /= scale; it.qOut /= scale; it.qStart /= scale; it.qEnd /= scale;
    });
  }
  return {items};
}

document.addEventListener('paste', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const dt = e.clipboardData; if (!dt) return;

  for (const it of dt.items){
    if (it.kind === 'file'){
      const f = it.getAsFile();
      if (f){ readFile(f); e.preventDefault(); return; }
    }
  }

  const html = dt.getData('text/html');
  const text = dt.getData('text/plain');

  let rows = null, src = '';
  if (html && /<table/i.test(html)){
    rows = parseHtmlTable(html);
    src = 'HTML';
  }
  if ((!rows || rows.length < 3) && text){
    const textRows = parsePlainText(text);
    if (!rows || textRows.length > rows.length){
      rows = textRows; src = 'TEXT';
    }
  }
  if (!rows || !rows.length){
    toast('Пустой буфер. Скопируйте таблицу из Excel/1С и нажмите Ctrl+V.', 'warn');
    return;
  }
  handleRows(rows, `Буфер: ${src}, строк ${rows.length}`);
  e.preventDefault();
});

function parsePlainText(text){
  const lines = text.split(/\r?\n/);
  const splitters = [
    l => l.split('\t'),
    l => l.split(/\s{2,}/),
    l => l.split(';'),
  ];
  let best = null, bestCount = -1;
  for (const split of splitters){
    const rows = lines.map(l => split(l).map(cleanCell));
    const hi = findHeaderRow(rows);
    if (hi >= 0){
      const n = rows.length - hi - 1;
      if (n > bestCount){ bestCount = n; best = rows; }
    }
  }
  if (best) return best;
  return lines.map(l => l.split('\t').map(cleanCell));
}

function readFile(file){
  const name = file.name || '';
  if (/\.(txt|csv)$/i.test(name)){
    const r = new FileReader();
    r.onload = ev => handleRows(parsePlainText(String(ev.target.result)), `Файл ${name}`);
    r.readAsText(file); return;
  }
  if (/\.json$/i.test(name)){
    const r = new FileReader();
    r.onload = ev => loadJSON(String(ev.target.result));
    r.readAsText(file); return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const found = [];
      wb.SheetNames.forEach(sheetName => {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, defval:'', raw:false});
        const kind = classifyTable(rows);
        if (kind) found.push({sheetName, rows, kind});
      });
      const stocks = found.filter(t => t.kind === 'stock');
      const moves = found.filter(t => t.kind === 'move');
      if (stocks.length && moves.length){
        stocks.forEach(t => {
          const stock = parseStock(t.rows);
          if (stock && !stock.error && stock.items) setStock(stock.items, false, name + ' / ' + t.sheetName);
        });
        moves.forEach(t => {
          const data = parseMovement(t.rows);
          if (data && data.items && data.items.length){
            STATE.items = data.items;
            STATE.flow = buildFlow(data.items);
          }
        });
        touchData();
        autosaveData();
        STATE.stage = 'stock';
        syncStageUI();
        renderMap();
        toast('В файле и остатки, и движения — загружены раздельно');
        return;
      }
      if (found.length === 1){
        const t = found[0];
        handleRows(t.rows, 'Файл ' + name + ' / ' + t.sheetName);
        return;
      }
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:false});
      handleRows(rows, 'Файл ' + name);
    } catch(err){
      toast('Ошибка чтения файла: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseHtmlTable(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) return null;
  const rows = [];
  table.querySelectorAll('tr').forEach(tr => {
    const cells = [...tr.querySelectorAll('th,td')].map(td =>
      (td.innerText || '').replace(/\u00A0/g,' ').trim()
    );
    if (cells.length) rows.push(cells);
  });
  return rows;
}

const HOMO = {A:'A',А:'A',B:'B',В:'B',C:'C',С:'C',E:'E',Е:'E',H:'H',Н:'H',K:'K',К:'K',M:'M',М:'M',O:'O',О:'O',P:'P',Р:'P',T:'T',Т:'T',X:'X',Х:'X',Y:'Y',У:'Y'};
function cellKey(s){
  return cleanCell(s).toUpperCase().replace(/[A-ZА-ЯЁ]/g, ch => HOMO[ch] || ch);
}
function ruNumber(v){
  if (typeof v === 'number' && isFinite(v)) return v;
  let s = String(v ?? '').replace(/\u00A0/g, ' ').trim();
  if (!s) return 0;
  s = s.replace(/\s/g, '');
  if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  const n = parseFloat(s.replace(/[^\d.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}
function asBarcode(v){
  if (typeof v === 'number' && isFinite(v)) return String(Math.round(v));
  return cleanCell(v).replace(/\s/g, '');
}
function stockColumns(rows){
  const limit = Math.min(rows.length, 40);
  let barcode = -1, article = -1, cell = -1, qty = -1, volume = -1;
  for (let i = 0; i < limit; i++){
    const r = rows[i] || [];
    for (let c = 0; c < r.length; c++){
      const t = cleanCell(r[c]).toLowerCase().replace(/\s+/g, ' ');
      if (!t) continue;
      if (t === 'штрихкод' || t.startsWith('штрихкод ')) barcode = c;
      else if (t === 'артикул' || t.startsWith('артикул ')) article = c;
      else if (t === 'ячейка' || t.startsWith('ячейка ')) cell = c;
      else if (t.includes('количество') && t.includes('остат')) qty = c;
      else if ((t.includes('объем') || t.includes('объём')) && t.includes('остат')) volume = c;
    }
  }
  if (barcode < 0 || article < 0 || cell < 0) return null;
  if (qty < 0) qty = Math.max(barcode, article, cell) + 1;
  return {barcode, article, cell, qty, volume};
}
function parseStock(rows){
  const col = stockColumns(rows);
  if (!col) return null;
  const textOf = (r) => cleanCell(r[col.barcode] || r[0] || '');
  const kindOf = (r) => {
    if (!r || !r.some(v => cleanCell(v))) return 'empty';
    const text = textOf(r);
    const low = text.toLowerCase();
    if (/^итого(?:\s|$)/.test(low)) return 'total';
    if (/^(параметры|отбор)(?:\s|:|$)/.test(low)) return 'empty';
    if (/^(контрагент|номенклатура|склад|штрихкод|артикул|ячейка)$/.test(low)) return 'empty';
    const barcode = asBarcode(r[col.barcode]);
    const cell = cleanCell(r[col.cell]);
    if (/^\d{8,14}$/.test(barcode) && cell) return 'detail';
    if (/^склад(?:\s|$)/.test(low)) return 'warehouse';
    if (text) return 'group';
    return 'empty';
  };
  const nextKind = (i) => {
    for (let j = i + 1; j < rows.length; j++){
      const k = kindOf(rows[j]);
      if (k !== 'empty') return k;
    }
    return 'empty';
  };
  const items = [];
  let contractor = '', name = '', warehouse = '';
  for (let i = 0; i < rows.length; i++){
    const r = rows[i] || [];
    const kind = kindOf(r);
    if (kind === 'empty') continue;
    if (kind === 'total') break;
    if (kind === 'warehouse'){ warehouse = textOf(r); continue; }
    if (kind === 'group'){
      const text = textOf(r);
      if (nextKind(i) === 'group'){ contractor = text; name = ''; warehouse = ''; }
      else name = text;
      continue;
    }
    const cell = cleanCell(r[col.cell]);
    if (!cell) continue;
    items.push({
      cell, name,
      article: cleanCell(r[col.article]),
      barcode: asBarcode(r[col.barcode]),
      qty: ruNumber(r[col.qty]),
      volume: col.volume >= 0 ? ruNumber(r[col.volume]) : 0,
      warehouse, contractor,
    });
  }
  if (!items.length) return {error:'В остатках нет строк со штрихкодом и ячейкой.'};
  let total = null;
  for (let i = rows.length - 1; i >= 0; i--){
    if (/^итого(?:\s|$)/.test(cleanCell(rows[i][0] || '').toLowerCase())){
      total = ruNumber(rows[i][col.qty]);
      break;
    }
  }
  const rawSum = items.reduce((s, it) => s + it.qty, 0);
  if (total && rawSum){
    const ratio = rawSum / total;
    const rounded = Math.round(ratio);
    if (rounded >= 10 && Math.abs(ratio - rounded) / rounded < 0.002 && rounded % 10 === 0){
      items.forEach(it => { it.qty = it.qty / rounded; });
    }
  }
  return {items};
}
function mergeStock(items){
  const map = new Map();
  (items || []).forEach(it => {
    if (!it || !it.cell) return;
    const barcode = asBarcode(it.barcode);
    const article = cleanCell(it.article);
    const cell = cleanCell(it.cell);
    const k = cellKey(cell) + '\n' + barcode + '\n' + article;
    const prev = map.get(k);
    const qty = Number(it.qty) || 0;
    const volume = Number(it.volume) || 0;
    if (!prev){
      map.set(k, {
        cell, name: cleanCell(it.name), article, barcode, qty, volume,
        warehouse: cleanCell(it.warehouse), contractor: cleanCell(it.contractor),
      });
    } else {
      prev.qty += qty;
      prev.volume += volume;
      if (!prev.name && it.name) prev.name = cleanCell(it.name);
    }
  });
  return [...map.values()];
}
function cellKeyIndex(){
  const m = new Map();
  getAllCells().forEach(c => { if (!m.has(cellKey(c))) m.set(cellKey(c), c); });
  return m;
}
let stockCache = null;
function stockIndex(){
  if (stockCache && stockCache.stock === STATE.stock && stockCache.rev === STATE._rev) return stockCache.map;
  const map = new Map();
  STATE.stock.forEach(it => {
    const k = cellKey(it.cell);
    let g = map.get(k);
    if (!g){ g = {qty:0, lines:[]}; map.set(k, g); }
    g.qty += Number(it.qty) || 0;
    g.lines.push(it);
  });
  for (const g of map.values()) g.lines.sort((a, b) => a.qty - b.qty || String(a.name).localeCompare(String(b.name), 'ru'));
  stockCache = {stock: STATE.stock, rev: STATE._rev, map};
  return map;
}
let searchCache = null;
function searchModel(){
  const q = String(STATE.query || '').trim();
  if (q.length < 2) return null;
  if (searchCache && searchCache.q === q && searchCache.stock === STATE.stock) return searchCache.model;
  const tokens = q.toLowerCase().replace(/ё/g, 'е').split(/\s+/).filter(Boolean);
  const groups = new Map();
  STATE.stock.forEach(it => {
    const hay = (it.name + ' ' + it.article + ' ' + it.barcode).toLowerCase().replace(/ё/g, 'е');
    if (!tokens.every(t => hay.includes(t))) return;
    const pk = it.barcode + '\n' + it.article + '\n' + it.name;
    if (!groups.has(pk)) groups.set(pk, {name:it.name, article:it.article, barcode:it.barcode, lines:[]});
    const g = groups.get(pk);
    const key = cellKey(it.cell);
    const prev = g.lines.find(l => l.key === key);
    if (prev) prev.qty += Number(it.qty) || 0;
    else g.lines.push({cell:it.cell, key, qty:Number(it.qty) || 0});
  });
  const products = [...groups.values()];
  products.forEach(p => {
    p.lines.sort((a, b) => a.qty - b.qty || a.cell.localeCompare(b.cell, 'ru', {numeric:true}));
    const qs = p.lines.map(l => l.qty);
    const min = qs.length ? Math.min(...qs) : 0;
    const max = qs.length ? Math.max(...qs) : 0;
    p.min = min;
    p.max = max;
    p.lines.forEach((l, i) => {
      l.rank = i + 1;
      l.t = max === min ? 0 : (l.qty - min) / (max - min);
    });
  });
  products.sort((a, b) => (a.min - b.min) || String(a.name).localeCompare(String(b.name), 'ru'));
  const model = {products};
  searchCache = {q, stock: STATE.stock, model};
  return model;
}

function handleRows(rows, src){
  if (!rows || !rows.length){ toast('Пустой буфер', 'warn'); return; }

  const kind = classifyTable(rows);
  if (kind === 'move'){
    const data = parseMovement(rows);
    if (data.error){ toast(data.error, 'err'); return; }
    if (!data.items.length){
      toast('Таблица движений (' + src + ') без строк. Скопируйте таблицу вместе с данными.', 'warn');
      return;
    }
    STATE.items = data.items;
    STATE.flow = buildFlow(data.items);
    STATE.stage = 'move';
    touchData();
    syncStageUI();
    autosaveData();
    flashBadge('Движений: ' + data.items.length);
    toast('Таблица движений: ' + data.items.length + ' строк · ' + src);
    renderMap();
    return;
  }

  if (kind === 'stock'){
    const stock = parseStock(rows);
    if (!stock){ toast('Таблица похожа на остатки, но строки не разобрались (' + src + ')', 'warn'); return; }
    if (stock.error){ toast(stock.error, 'err'); return; }
    STATE.stage = 'stock';
    syncStageUI();
    setStock(stock.items, true, src);
    return;
  }

  const firstCol = rows.map(r => norm(r[0])).filter(Boolean);
  if (!firstCol.length){ toast('Пустой буфер', 'warn'); return; }

  const palletMatches = firstCol.filter(v => v.toLowerCase() === 'паллет-место').length;
  if (palletMatches >= Math.max(5, firstCol.length*0.8)){
    STATE.palletCount = palletMatches;
    STATE.cellList = []; STATE.items = []; STATE.flow = [];
    Object.keys(CELL_OFFSETS).forEach(k => delete CELL_OFFSETS[k]);
    STATE.selectedCells.clear();
    autosaveLayout();
    flashBadge(`Паллетомест: ${palletMatches}`);
    toast(`Построена сетка паллетомест: ${palletMatches}`);
    renderMap();
    return;
  }

  const cellRe = /^[A-Za-zА-Яа-я]+\d+([-/]\d+)?([-/]\d+)?$/;
  const looksLikeCells = firstCol.filter(v => cellRe.test(v.replace(/\s+/g,''))).length >= firstCol.length*0.7;
  if (looksLikeCells){
    STATE.palletCount = 0;
    STATE.cellList = firstCol;
    STATE.items = []; STATE.flow = [];
    Object.keys(CELL_OFFSETS).forEach(k => delete CELL_OFFSETS[k]);
    STATE.selectedCells.clear();
    autosaveLayout();
    flashBadge(`Ячеек: ${firstCol.length}`);
    toast(`Карта перестроена: ${firstCol.length} ячеек`);
    renderMap();
    return;
  }
  flashBadge('Формат не распознан');
  toast(`Не понял формат (${src}). Первые строки: ${rows.slice(0,3).map(r=>r.slice(0,4).join(' | ')).join(' ⏎ ')}`, 'warn');
}

function naturalCompare(a, b){
  return String(a).localeCompare(String(b), 'ru', {numeric:true});
}

function buildGrid(){
  const cells = getAllCells();
  const byLine = new Map();
  cells.forEach(c => {
    const p = parseCell(c);
    if (!byLine.has(p.line)) byLine.set(p.line, []);
    byLine.get(p.line).push({cell:c, ...p});
  });
  const arr = [...byLine.entries()].map(([line, list]) => {
    list.sort((a, b) => naturalCompare(a.raw, b.raw));
    return {line, cells:list};
  });
  const order = (line) => {
    const m = line.match(/^B(\d+)(?:\/(\d+))?$/);
    if (m) return +m[1] * 100 + (m[2] ? +m[2] : 0);
    if (line.startsWith('Паллеты')) return 8000 + (+line.replace(/\D/g, '') || 0);
    if (line.startsWith('Спец')) return 9998;
    if (line.startsWith('Прочее')) return 9999;
    return 9000;
  };
  arr.sort((a, b) => order(a.line) - order(b.line) || naturalCompare(a.line, b.line));
  return arr;
}

let layoutGeom = 'fixed';
let geomExpanded = false;
const CELL = {w:148, h:58, gapX:16, gapY:20, padX:40, padY:96};

function computeLayout(){
  const grid = buildGrid();
  const {w, h, gapX, gapY, padX, padY} = CELL;
  const base = {};
  grid.forEach((g, li) => {
    const y = padY + li * (h + gapY);
    g.cells.forEach((c, ci) => {
      const x = padX + ci * (w + gapX);
      base[c.cell] = {x, y, w, h, line:g.line, slot:c.slot};
    });
  });
  return {grid, base};
}
function frameReadable(){
  const {base} = computeLayout();
  let minX = Infinity, minY = Infinity;
  Object.entries(base).forEach(([c, b]) => {
    const o = CELL_OFFSETS[c] || {dx:0, dy:0};
    minX = Math.min(minX, b.x + o.dx);
    minY = Math.min(minY, b.y + o.dy);
  });
  if (!isFinite(minX)) return;
  VIEW.scale = 1;
  VIEW.tx = 28 - minX;
  VIEW.ty = 84 - minY;
}
function expandLegacyToFixed(){
  const W = window.innerWidth || 1280;
  const H = window.innerHeight || 800;
  const old = computeLegacyLayout(W, H);
  const sample = Object.values(old.base)[0];
  const oldW = sample ? sample.w : 28;
  const oldH = sample ? sample.h : 22;
  const kX = CELL.w / Math.max(14, oldW);
  const kY = CELL.h / Math.max(16, oldH);
  let minX = Infinity, minY = Infinity;
  const pts = {};
  Object.entries(old.base).forEach(([c, b]) => {
    const o = CELL_OFFSETS[c] || {dx:0, dy:0, pinned:false};
    const x = b.x + o.dx, y = b.y + o.dy;
    pts[c] = {x, y, pinned:!!o.pinned};
    if (x < minX) minX = x;
    if (y < minY) minY = y;
  });
  if (!isFinite(minX)) minX = 0;
  if (!isFinite(minY)) minY = 0;
  layoutGeom = 'fixed';
  const fresh = computeLayout();
  Object.entries(pts).forEach(([c, p]) => {
    const n = fresh.base[c];
    if (!n) return;
    CELL_OFFSETS[c] = {
      dx:(p.x - minX) * kX - n.x,
      dy:(p.y - minY) * kY - n.y,
      pinned:p.pinned,
    };
  });
  Object.keys(CELL_OFFSETS).forEach(c => {
    if (pts[c]) return;
    CELL_OFFSETS[c].dx *= kX;
    CELL_OFFSETS[c].dy *= kY;
  });
  frameReadable();
  geomExpanded = true;
}
function computeLegacyLayout(W, H){
  const grid = buildGrid();
  const padX = 60, padY = 30, headerW = 70, headerH = 22;
  const lineH = Math.max(30, (H - padY * 2) / Math.max(1, grid.length));
  const maxCells = Math.max(1, ...grid.map(g => g.cells.length));
  const cellW = Math.max(14, Math.min(56, (W - padX * 2 - headerW) / maxCells));
  const cellH = Math.max(16, lineH - 8);
  const base = {};
  grid.forEach((g, li) => {
    const y = padY + headerH + li * lineH;
    g.cells.forEach((c, ci) => {
      const x = padX + headerW + ci * cellW;
      base[c.cell] = {x, y, w:cellW, h:cellH, line:g.line, slot:c.slot};
    });
  });
  return {grid, base};
}

function getAllCells(){
  if (STATE.palletCount > 0){
    const perLine = Math.ceil(STATE.palletCount / 11);
    const arr = [];
    for (let l = 1; l <= 11; l++){
      for (let s = 1; s <= perLine; s++){
        const idx = (l - 1) * perLine + s;
        if (idx > STATE.palletCount) break;
        arr.push('ПМ-' + l + '-' + String(s).padStart(2, '0'));
      }
    }
    return arr.filter(c => !STATE.removed.has(c));
  }
  const set = new Set(STATE.cellList.filter(c => !STATE.removed.has(c)));
  STATE.items.forEach(x => { if (x.cell && !STATE.removed.has(x.cell)) set.add(x.cell); });
  return [...set];
}

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseItemDay(item){
  if (!item.date || !item.date.d) return null;
  const m = String(item.date.d).match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return null;
  return new Date(+m[3], +m[2] - 1, +m[1]);

function periodDateValue(){

  return el && el.value ? el.value : '';
}
function inPeriod(item){
  if (STATE.period === 'all') return true;
  const day = parseItemDay(item);
  if (!day) return false;
  const today = startOfDay(new Date());
  const diff = Math.round((today - startOfDay(day)) / 86400000);
  if (STATE.period === 'today') return diff === 0;
  if (STATE.period === 'yesterday') return diff === 1;
  if (STATE.period === '7') return diff >= 0 && diff < 7;
  if (STATE.period === '30') return diff >= 0 && diff < 30;
  if (STATE.period === 'day'){
    const v = periodDateValue();
    if (!v) return diff === 0;
    const parts = v.split('-').map(Number);
    return day.getFullYear() === parts[0] && day.getMonth() === parts[1] - 1 && day.getDate() === parts[2];
  }
  return true;
}
function periodLabel(){
  if (STATE.period === 'today') return 'сегодня';
  if (STATE.period === 'yesterday') return 'вчера';
  if (STATE.period === '7') return '7 дней';
  if (STATE.period === '30') return '30 дней';
  if (STATE.period === 'day'){
    const v = periodDateValue();
    if (!v) return 'дату';
    const p = v.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }
  return 'всё время';
}

    if (!s){ s = {inQ:0, outQ:0, end:0, ops:0}; map.set(x.cell, s); }
    s.inQ += x.qIn || 0;
    s.outQ += x.qOut || 0;
    s.ops++;
    s.end = x.qEnd || 0;
  });
  return map;
}

function strokeDashedQuad(g, a, c, b, tEnd, dash, gap, width, color, alpha){
  dash = Math.max(0.6, dash || 1);
  gap = Math.max(0.4, gap || 1);
  const steps = Math.max(12, Math.min(48, Math.ceil(36 * Math.max(tEnd, 0.2))));
  let prev = a;
  let acc = 0;
  let on = true;
  for (let i = 1; i <= steps; i++){
    const p = quadAt(a, c, b, (i / steps) * tEnd);
    let left = Math.hypot(p.x - prev.x, p.y - prev.y);
    let x0 = prev.x, y0 = prev.y;
    while (left > 0.15){
      const room = (on ? dash : gap) - acc;
      if (room <= 0.15){
        acc = 0;
        on = !on;
        continue;
      }
      if (left <= room){
        if (on){
          g.beginPath();
          g.moveTo(x0, y0);
          g.lineTo(p.x, p.y);
          g.stroke({width, color, alpha, cap:'butt'});
        }
        acc += left;
        left = 0;
      } else {
        const r = room / left;
        const x1 = x0 + (p.x - x0) * r;
        const y1 = y0 + (p.y - y0) * r;
        if (on){
          g.beginPath();
          g.moveTo(x0, y0);
          g.lineTo(x1, y1);
          g.stroke({width, color, alpha, cap:'butt'});
        }
        acc = 0;
        on = !on;
        left -= room;
        x0 = x1;
        y0 = y1;
      }
    }
    prev = p;
  }
}

function strokeChevronQuad(g, a, c, b, width, color, alpha, head, wing, step){

      }
      html += '<div>' + esc(x.cell) + (on ? '' : ' <span class="off">другой склад</span>') + ' · <b>' + q + '</b></div>';
      if (x.name) html += '<div class="meta">' + esc(x.name) + '</div>';
      html += '<div class="meta">' + esc(x.article || '—') + ' · ' + esc(x.barcode || '—') + '</div>';
      if (x.reg) html += '<div class="meta">' + esc(x.reg) + '</div>';
      html += '</div>';
    });
    if (rows.length > 400) html += '<div class="empty">ещё ' + (rows.length - 400) + '</div>';
  } else if (STATE.sideTab === 'audit'){
    html += '<div class="sub">Жёлтые ячейки с ! — их стоит пересчитать по факту. Причина написана рядом. <button type="button" class="linkbtn" data-print="minus">Печать A4</button></div>';
    if (!rep.suspects.length) html += '<div class="empty">На карте нет ячеек с минусом</div>';
    rep.suspects.forEach(row => {
      html += '<div class="side-row" data-cell="' + esc(row.mapped || row.cell) + '"><b>! ' + esc(row.mapped || row.cell) + '</b>';
      html += '<div>сумма ' + fmt(row.qty) + '</div>';
      row.reasons.forEach(r => { html += '<div class="reason">' + esc(r) + '</div>'; });
      html += '</div>';
    });
    html += '<div class="sub" style="margin-top:12px">Другой склад · ' + rep.foreign.length + ' ячеек нет на этой карте</div>';
    if (!rep.foreign.length) html += '<div class="empty">Все ячейки остатков есть на карте</div>';
    rep.foreign.forEach(row => {
      html += '<div class="side-row" data-cell="' + esc(row.cell) + '"><b>' + esc(row.cell) + '</b>';
      html += '<div class="off">не открыта на этой карте</div>';
      html += '<div>сумма ' + fmt(row.qty) + ' · ' + row.lines + ' поз.</div>';
      row.reasons.forEach(r => { html += '<div class="reason">' + esc(r) + '</div>'; });
      html += '</div>';
    });
  } else {
    const products = productReport();
    let offCells = 0;
    const seenOff = new Set();
    products.forEach(p => p.cells.forEach(c => { if (!c.on && !seenOff.has(c.key)){ seenOff.add(c.key); offCells++; } }));
    html += '<div class="sub">' + products.length + ' товаров · ' + STATE.stock.length + ' позиций';
    if (offCells) html += ' · другой склад ' + offCells + ' ячеек';
    html += '</div>';
    if (!products.length) html += '<div class="empty">Остатки ещё не загружены</div>';
    products.forEach(p => {
      const neg = p.qty < 0;
      html += '<div class="side-row"><b' + (neg ? ' class="neg"' : '') + '>' + esc(p.name || 'Без названия') + '</b>';
      html += '<div class="meta">' + esc(p.article || '—') + ' · ' + esc(p.barcode || '—') + ' · <b' + (neg ? ' class="neg"' : '') + '>' + fmt(p.qty) + '</b></div>';
      p.cells.slice(0, 10).forEach(c => {
        html += '<span class="chip' + (c.on ? '' : ' off') + '" data-cell="' + esc(c.cell) + '">' + esc(c.cell) + ' ' + fmt(c.qty) + (c.on ? '' : ' · не здесь') + '</span>';
      });
      if (p.cells.length > 10) html += '<div class="meta">ещё ячеек: ' + (p.cells.length - 10) + '</div>';
      html += '</div>';
    });
  }
  body.innerHTML = html;
}

function sidePad(){
  const side = $('#side');
  if (!side) return {left:28, right:28, top:78, bottom:28};
  const r = side.getBoundingClientRect();
  if (r.width < 40 || r.height < 40) return {left:28, right:28, top:78, bottom:28};
  if (r.top > window.innerHeight * 0.45){
    return {left:16, right:16, top:78, bottom: Math.max(28, window.innerHeight - r.top + 12)};
  }
  return {left:28, right: Math.max(28, window.innerWidth - r.left + 12), top:78, bottom:28};
}

async function fetchKind(url, kind, apply){
  try {
    const res = await fetch(url, {cache:'no-store'});
    if (!res.ok) return;
    const obj = await res.json();
    if (!obj || obj.kind !== kind) return;
    apply(obj);
  } catch (_) {}
}
function renderMap(){
  if (!world) return;
  const W = window.innerWidth, H = window.innerHeight;
  const {base} = computeLayout();
  const view = viewModel();
  const stats = view.stats;
  let maxStock = 1;
  stats.forEach(s => { if (s.ops > 0 && s.end > maxStock) maxStock = s.end; });

  world.position.set(VIEW.tx, VIEW.ty);
  world.scale.set(VIEW.scale);

  const positions = {};
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  Object.entries(base).forEach(([cell, b]) => {
    const off = CELL_OFFSETS[cell] || {dx:0, dy:0};
    const pos = {x:b.x + off.dx, y:b.y + off.dy, w:b.w, h:b.h};
    positions[cell] = pos;
    minX = Math.min(minX, pos.x);
    minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + pos.w);
    maxY = Math.max(maxY, pos.y + pos.h);
  });
  if (!isFinite(minX)){ minX = 0; minY = 0; maxX = 0; maxY = 0; }

  const drawn = drawMovementEdges(view, positions, {minX, minY, maxX, maxY});
  const edgeInfo = drawn.edgeInfo;
  const flowHits = drawn.flowHits;

  const hit = [];
  const alive = new Set();
  const paint = paintMatches();
  let maxAbs = 1;
  if (!paint){
    stockIndex().forEach(g => { if (Math.abs(g.qty) > maxAbs) maxAbs = Math.abs(g.qty); });
  }
  Object.entries(base).forEach(([cell, b]) => {
    const pos = positions[cell];
    const off = CELL_OFFSETS[cell] || {dx:0, dy:0, pinned:false};
    const st = statOf(stats, cell);
    const used = st.ops > 0;
    const selected = STATE.selectedCells.has(cell);
    const hovered = STATE.hoveredCell === cell;
    const mark = paint ? paint.get(cellKey(cell)) : null;
    const stockG = stockIndex().get(cellKey(cell));
    const flag = auditFlags().get(cell);
    let fill = '#3a3b40';
    if (paint){
      fill = mark ? heatColor(mark.t) : '#2a2b30';
    } else if (flag){
      fill = '#e0b15a';
    } else if (STATE.stage === 'stock'){
      if (stockG && stockG.lines.length){
        const t = Math.min(1, Math.abs(stockG.qty) / maxAbs);
        fill = mixColor('#3a3b40', '#c8c8ce', Math.max(0.2, t));
      }
    } else if (used){
      const t = Math.min(1, Math.max(0, st.end) / maxStock);
      fill = mixColor('#4a4b52', '#b4b4ba', Math.max(0.14, t));
    }
    if (hovered && !selected) fill = mixColor(fill, '#ffffff', 0.1);
    const loose = looseCells.has(cell);
    const stroke = loose ? '#ffb020' : (selected ? '#3b82f6' : (flag ? '#f4e2b0' : (mark ? '#f4f1e8' : (off.pinned ? '#c8c8ce' : (used ? '#6e6f76' : '#4a4b52')))));
    const lw = loose ? 3 : (selected ? 3 : (mark ? 2.5 : (off.pinned ? 2 : 1)));
    const textColor = paint && !mark ? '#8d8d96' : (luminance(fill) < 150 ? '#f2f2f2' : '#1a1b1e');
    const rankText = mark && mark.rank ? String(mark.rank) : (flag ? '!' : '');
    const sig = fill + '|' + stroke + '|' + lw + '|' + (off.pinned ? 1 : 0) + '|' + (loose ? 1 : 0) + '|' + textColor + '|' + b.w + '|' + b.h + '|' + rankText;
    const viewCell = ensureCellView(cell);
    alive.add(cell);
    viewCell.root.visible = true;
    viewCell.root.position.set(pos.x, pos.y);
    if (viewCell.sig !== sig){
      viewCell.sig = sig;
      viewCell.gfx.clear();
      viewCell.gfx.roundRect(1, 1, Math.max(4, b.w - 2), Math.max(4, b.h - 2), 8);
      viewCell.gfx.fill(cssToHex(fill));
      viewCell.gfx.stroke({width:lw, color:cssToHex(stroke)});
      if (off.pinned){
        viewCell.gfx.rect(b.w - 10, 5, 4, 4);
        viewCell.gfx.fill(0xe6e6e6);
      }
      if (rankText){
        viewCell.gfx.circle(20, 18, 13);
        viewCell.gfx.fill(0x1a1b1e);
      }
      viewCell.rank.visible = !!rankText;
      viewCell.rank.text = rankText;
      viewCell.rank.position.set(20, 18);
      viewCell.label.text = cell;
      viewCell.label.style.fill = textColor;
      viewCell.label.scale.set(1);
      const maxW = Math.max(8, b.w - (rankText ? 40 : 22));
      const maxH = Math.max(8, b.h - 14);
      const fit = Math.min(maxW / Math.max(1, viewCell.label.width), maxH / Math.max(1, viewCell.label.height));
      viewCell.label.scale.set(fit);
    }
    viewCell.label.position.set(rankText ? b.w / 2 + 8 : b.w / 2, b.h / 2);
    hit.push({cell, x:pos.x, y:pos.y, w:b.w, h:b.h});
  });
  cellViews.forEach((v, cell) => {
    if (alive.has(cell)) return;
    v.root.destroy({children:true});
    cellViews.delete(cell);
  });

  marqueeGfx.clear();
  if (MARQUEE && MARQUEE.active){
    const x1 = Math.min(MARQUEE.startWorld.x, MARQUEE.currentWorld.x);
    const y1 = Math.min(MARQUEE.startWorld.y, MARQUEE.currentWorld.y);
    const x2 = Math.max(MARQUEE.startWorld.x, MARQUEE.currentWorld.x);
    const y2 = Math.max(MARQUEE.startWorld.y, MARQUEE.currentWorld.y);
    marqueeGfx.rect(x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
    marqueeGfx.fill({color:0x3b82f6, alpha:0.16});
    marqueeGfx.stroke({width:2, color:0x3b82f6, alpha:0.95});
  }

  renderMarkers();
  flowHits.forEach(h => hit.push(h));
  MAP = {W, H, hit, base, edgeInfo, positions, bounds:{minX, minY, maxX, maxY}};
  updateChrome();
}

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function updateChrome(){
  const n = MAP && MAP.hit ? MAP.hit.filter(h => !h.flow).length : getAllCells().length;
  const sel = STATE.selectedCells.size;
  const stockCells = stockIndex().size;
  let text;
  const model = searchModel();
  if (model){
    const places = new Set();
    model.products.forEach(p => p.lines.forEach(l => places.add(l.key)));
    text = model.products.length + ' ' + plural(model.products.length, 'товар', 'товара', 'товаров')
      + ' · ' + places.size + ' ' + plural(places.size, 'ячейка', 'ячейки', 'ячеек');
  } else if (STATE.stage === 'audit'){
    const rep = auditReport();
    text = rep.suspects.length + ' ' + plural(rep.suspects.length, 'ячейка', 'ячейки', 'ячеек') + ' проверить · другой склад ' + rep.foreign.length;
  } else if (STATE.stage === 'stock'){
    text = n + ' на карте · ' + stockCells + ' в базе · ' + STATE.stock.length + ' ' + plural(STATE.stock.length, 'позиция', 'позиции', 'позиций');
  } else {
    const vm = viewModel();
    const m = vm.items.length;
    text = n + ' ' + plural(n, 'ячейка', 'ячейки', 'ячеек') + ' · ' + m + ' ' + plural(m, 'движение', 'движения', 'движений') + ' · линий ' + vm.flow.length;
  }
  if (sel) text += ' · выделено ' + sel;
  const loaded = STATE.items.length > 0;
  $('#flowLegend').hidden = !loaded;
  if (loaded){
    const shown = STATE._arrowShown || 0;
    const total = STATE._arrowTotal || STATE.flow.length;
    $('#flowTitle').textContent = STATE.stage === 'move'
      ? ('На карте ' + shown + ' из ' + total)
      : ('Движение загружено · ' + STATE.items.length);
  }
  $('#status').textContent = text;
  $('#deleteCell').disabled = sel === 0;
  $('#renameCell').disabled = sel !== 1;
  $('#pinCell').disabled = sel === 0;
  updateDetail();
  updatePick();
  updateSide();
}
function typeName(t){
  if (t === 'in') return 'Приход';
  if (t === 'out') return 'Расход';
  return 'Перемещение';
}
function dateKey(item){
  if (!item || !item.date || !item.date.d) return '';
  const p = String(item.date.d).split('.');
  if (p.length < 3) return '';
  return p[2] + p[1] + p[0] + (item.date.t || '');
}
function stockLinesFor(cell){
  const g = stockIndex().get(cellKey(cell));
  return g ? g.lines : [];
}
function stockBlock(lines, limit){
  if (!lines.length) return '<div class="empty">В базе нет товаров этой ячейки</div>';
  const cap = limit || 40;
  let html = '';
  lines.slice(0, cap).forEach(x => {
    html += '<div class="mv" title="' + esc(x.name) + '"><span>' + esc(x.name)
      + '<br><span class="meta">' + esc(x.article || '—') + ' · ' + esc(x.barcode || '—') + '</span></span><b>'
      + fmt(x.qty) + '</b></div>';
  });
  if (lines.length > cap) html += '<div class="empty">ещё ' + (lines.length - cap) + '</div>';
  return html;
}
let detailSig = '';

    if (!rows.length) html += '<div class="empty">Нет движений за выбранный период</div>';

const activeTouches = new Map();

canvas.addEventListener('touchstart', e => {

    const a = pts[0], b = pts[1];
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    pinchState = {
      dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
      scale: VIEW.scale,
      world: screenToWorld({x:cx, y:cy}),
    };
    panState = null;
  } else if (activeTouches.size === 1){
    const p = [...activeTouches.values()][0];
    const pw = screenToWorld(p);
    const blocked = !!(pickEdge(pw) || hitMarker(pw));
    const cellHit = blocked ? null : hitCellAt(pw);
    const key = cellHit && !cellHit.flow ? cellHit.cell : '';
    const dbl = !placeTool && !blocked && noteClick(blocked ? '\0' : key);
    pinchState = null;
    if (dbl && key && (!looseCells.size || looseCells.has(key))){
      armLoose(key);
      startCellDrag(pw);
      panState = null;
      renderMap();
    } else if (key && looseCells.has(key) && !placeTool){
      startCellDrag(pw);
      panState = null;
    } else {
      if (dbl) disarmLoose();
      panState = {x:p.x, y:p.y, tx:VIEW.tx, ty:VIEW.ty, moved:false, touch:true};
      renderMap();
    }
  }

  if (pts.length >= 2){
    const a = pts[0], b = pts[1];
    const dist = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    if (!pinchState){
      pinchState = {dist, scale:VIEW.scale, world:screenToWorld({x:cx, y:cy})};
    }
    const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, pinchState.scale * dist / pinchState.dist));
    VIEW.scale = next;
    VIEW.tx = cx - pinchState.world.x * next;
    VIEW.ty = cy - pinchState.world.y * next;
    panState = null;
    if (dragState && dragState.movable){
      dragState = null;
      canvas.classList.remove('dragging');
    }
    renderMap();

  }

    const pw = screenToWorld(p);
    const dx = pw.x - dragState.startWorld.x;
    const dy = pw.y - dragState.startWorld.y;
    if (Math.abs(dx) + Math.abs(dy) > 1){
      dragState.moved = true;
      markClickMoved();
    }
    dragState.movable.forEach(c => {
      const s = dragState.starts[c];
      const prev = CELL_OFFSETS[c] || {};
      CELL_OFFSETS[c] = {dx:s.dx + dx, dy:s.dy + dy, pinned:!!prev.pinned};
    });
    renderMap();
    return;
  }
  if (panState && panState.touch && pts.length === 1){
    const p = pts[0];
    if (Math.abs(p.x - panState.x) + Math.abs(p.y - panState.y) > 8){
      panState.moved = true;
      markClickMoved();
    }

    pinchState = null;
    panState = {x:p.x, y:p.y, tx:VIEW.tx, ty:VIEW.ty, moved:true, touch:true};
    return;
  }
  if (dragState && dragState.movable){
    const moved = dragState.moved;
    canvas.classList.remove('dragging');
    dragState = null;
    if (moved){
      markClickMoved();
      autosaveLayout(true);
      panState = null;
      pinchState = null;
      return;
    }
  }
  if (panState && panState.touch && !panState.moved && !pinchState){
    const pw = screenToWorld({x:panState.x, y:panState.y});
    const edgeHit = pickEdge(pw);
    if (edgeHit){
      STATE.pickedEdge = edgeHit.e;
      STATE.hoveredEdgeIdx = edgeHit.idx;
      STATE.selectedCells.clear();
      STATE.hoveredCell = null;
      detailSig = '';
      STATE.sideTab = 'moves';
      sideSig = '';
      setSideOpen(true);
      renderMap();
    } else {
      const hit = hitCellAt(pw);
      STATE.pickedEdge = null;
      STATE.selectedCells.clear();
      if (hit && !hit.flow) STATE.selectedCells.add(hit.cell);
      renderMap();

function isTypingTarget(el){

window.addEventListener('keydown', e => {
  const typing = isTypingTarget(e.target);
  if (e.key === 'Control' || e.key === 'Meta'){

      ctrlTap.used = false;
    }
    if (!typing) canvas.classList.add('marquee');

  }
  if (e.ctrlKey || e.metaKey) ctrlTap.used = true;
  if (e.key === '/' && !typing){
    e.preventDefault();
    const box = $('#search');
    box.focus();
    box.select();
    return;
  }
  if (typing) return;
  if (e.key === 'Escape'){
    if (!$('#dialog').hidden){ closeDialog(); return; }
    if (placeTool){ placeTool = null; syncToolUI(); return; }
    if (STATE.markerSel){ STATE.markerSel = null; renderMap(); return; }
    if (STATE.selectedCells.size){
      STATE.selectedCells.clear();
      renderMap();
    }
  } else if (e.key === 'Delete' && STATE.markerSel && !STATE.selectedCells.size){
    e.preventDefault();
    deleteMarker(STATE.markerSel);
  } else if (e.key === 'Delete' && STATE.selectedCells.size){
    e.preventDefault();
    deleteSelected();
  }
});
window.addEventListener('keyup', e => {
  if (e.key !== 'Control' && e.key !== 'Meta') return;

function cellTaken(name, except){
  const k = cellKey(name);
  return getAllCells().some(c => c !== except && cellKey(c) === k);
}
function materializeCells(){
  if (STATE.palletCount > 0){
    STATE.cellList = getAllCells();
    STATE.palletCount = 0;
  }
}
function focusCell(cell){
  const W = window.innerWidth, H = window.innerHeight;
  const b = computeLayout().base[cell];
  if (!b) return;
  const o = CELL_OFFSETS[cell] || {dx:0, dy:0};
  const scale = Math.min(MAX_ZOOM, Math.max(VIEW.scale, 0.9));
  VIEW.scale = scale;
  let cx = W / 2, cy = H / 2;
  const pick = $('#pick');
  if (pick && !pick.hidden){
    const r = pick.getBoundingClientRect();
    if (r.height > 40 && r.top > H * 0.45) cy = Math.max(110, (r.top + 70) / 2);
    else if (r.width > 40 && r.left > W * 0.4) cx = Math.max(80, r.left / 2);
  }
  VIEW.tx = cx - (b.x + o.dx + b.w / 2) * scale;
  VIEW.ty = cy - (b.y + o.dy + b.h / 2) * scale;
}
function clearRemoved(name){
  const n = name.toLowerCase();
  [...STATE.removed].forEach(r => { if (String(r).toLowerCase() === n) STATE.removed.delete(r); });
}
function addCell(name){
  name = String(name || '').trim();
  if (!name){ toast('Введите адрес'); return false; }
  if (cellTaken(name)){ toast('Такая ячейка уже есть'); return false; }
  materializeCells();
  clearRemoved(name);
  STATE.cellList.push(name);
  touchData();
  STATE.selectedCells = new Set([name]);
  focusCell(name);
  autosaveLayout(true);
  renderMap();
  toast('Добавлена ' + name);
  return true;
}
function renameSelected(name){
  name = String(name || '').trim();
  const old = [...STATE.selectedCells][0];
  if (!old){ toast('Сначала выделите ячейку'); return false; }
  if (!name){ toast('Введите адрес'); return false; }
  if (name === old) return true;
  if (cellTaken(name, old)){ toast('Такая ячейка уже есть'); return false; }
  materializeCells();
  const i = STATE.cellList.indexOf(old);
  if (i >= 0) STATE.cellList[i] = name;
  else STATE.cellList.push(name);
  clearRemoved(name);
  if (CELL_OFFSETS[old]){
    CELL_OFFSETS[name] = CELL_OFFSETS[old];
    delete CELL_OFFSETS[old];
  }
  let changed = 0;
  STATE.items.forEach(it => { if (it.cell === old){ it.cell = name; changed++; } });
  const oldKey = cellKey(old);
  STATE.stock.forEach(it => { if (cellKey(it.cell) === oldKey){ it.cell = name; changed++; } });
  stockCache = null;
  searchCache = null;
  STATE.flow = buildFlow(STATE.items);
  STATE._rev++;
  touchData();
  invalidateView();
  STATE.selectedCells = new Set([name]);
  autosaveLayout(true);
  if (changed){ autosaveData(); autosaveStock(); }
  renderMap();
  toast('Адрес: ' + name);
  return true;
}
function deleteSelected(){
  const list = [...STATE.selectedCells];
  if (!list.length){ toast('Сначала выделите ячейки'); return; }
  if (list.length > 20 && !confirm('Удалить ' + list.length + ' ячеек?')) return;
  materializeCells();
  const drop = new Set(list);
  STATE.cellList = STATE.cellList.filter(c => !drop.has(c));
  touchData();
  list.forEach(c => {
    STATE.removed.add(c);
    delete CELL_OFFSETS[c];
  });
  STATE.selectedCells.clear();
  autosaveLayout(true);
  renderMap();
  toast('Удалено: ' + list.length);
}
function togglePin(){
  const cells = [...STATE.selectedCells];
  if (!cells.length){ toast('Сначала выделите ячейки'); return; }
  const allPinned = cells.every(c => CELL_OFFSETS[c] && CELL_OFFSETS[c].pinned);
  cells.forEach(c => {
    const off = CELL_OFFSETS[c] || {dx:0, dy:0, pinned:false};
    off.pinned = !allPinned;
    CELL_OFFSETS[c] = off;
  });
  autosaveLayout(true);
  renderMap();
  toast(allPinned ? 'Закрепление снято' : 'Закреплено');
}

function zoomBy(factor){
  const W = window.innerWidth, H = window.innerHeight;
  const cx = W / 2, cy = H / 2;
  const pw = screenToWorld({x:cx, y:cy});
  const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, VIEW.scale * factor));
  VIEW.tx = cx - pw.x * next;
  VIEW.ty = cy - pw.y * next;
  VIEW.scale = next;
  renderMap();
  autosaveLayout(false);
}
function fitView(){
  const W = window.innerWidth, H = window.innerHeight;
  const base = computeLayout(W, H).base;
  const cells = Object.keys(base);
  if (!cells.length){
    VIEW.scale = 1; VIEW.tx = 0; VIEW.ty = 0;
    renderMap();
    autosaveLayout(true);
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  cells.forEach(c => {
    const b = base[c];
    const o = CELL_OFFSETS[c] || {dx:0, dy:0};
    const x = b.x + o.dx, y = b.y + o.dy;
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + b.w);
    maxY = Math.max(maxY, y + b.h);
  });
  const sp = sidePad();
  const padLeft = sp.left, padRight = sp.right, padTop = sp.top, padBottom = sp.bottom;
  const bw = Math.max(1, maxX - minX);
  const bh = Math.max(1, maxY - minY);
  const scale = Math.min(2.2, Math.max(MIN_ZOOM, Math.min((W - padLeft - padRight) / bw, (H - padTop - padBottom) / bh)));
  VIEW.scale = scale;
  VIEW.tx = padLeft + ((W - padLeft - padRight) - bw * scale) / 2 - minX * scale;
  VIEW.ty = padTop + ((H - padTop - padBottom) - bh * scale) / 2 - minY * scale;
  renderMap();
  autosaveLayout(true);
}
function fitCells(names){
  const W = window.innerWidth, H = window.innerHeight;
  const base = computeLayout().base;
  const cells = names.filter(c => base[c]);
  if (!cells.length) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  cells.forEach(c => {
    const b = base[c];
    const o = CELL_OFFSETS[c] || {dx:0, dy:0};
    const x = b.x + o.dx, y = b.y + o.dy;
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + b.w);
    maxY = Math.max(maxY, y + b.h);
  });
  let padX = 48;
  const padTop = 88;
  let padBottom = 36;
  const pick = $('#pick');
  if (pick && !pick.hidden){
    const r = pick.getBoundingClientRect();
    if (r.height > 40 && r.top > window.innerHeight * 0.45) padBottom = Math.max(36, window.innerHeight - r.top + 16);
    else if (r.left > window.innerWidth * 0.4) padX = Math.max(48, window.innerWidth - r.left + 16);
  }
  const bw = Math.max(1, maxX - minX);
  const bh = Math.max(1, maxY - minY);
  const scale = Math.min(2.2, Math.max(MIN_ZOOM, Math.min((W - padX * 2) / bw, (H - padTop - padBottom) / bh)));
  VIEW.scale = scale;
  VIEW.tx = (W - bw * scale) / 2 - minX * scale;
  VIEW.ty = padTop + ((H - padTop - padBottom) - bh * scale) / 2 - minY * scale;
  renderMap();
  autosaveLayout(false);
}
let lastFitKey = '';
function fitMatches(force){
  const model = searchModel();
  if (!model || !model.products.length){ lastFitKey = ''; return; }
  const idx = cellKeyIndex();
  const names = [];
  const list = model.products.length === 1 ? model.products[0].lines : model.products.flatMap(p => p.lines);
  list.forEach(l => {
    const mapped = idx.get(l.key);
    if (mapped && names.indexOf(mapped) < 0) names.push(mapped);
  });
  if (!names.length) return;
  const key = names.join('|');
  if (!force && key === lastFitKey) return;
  lastFitKey = key;
  fitCells(names);
}
function focusMapped(cell){
  const mapped = cellKeyIndex().get(cellKey(cell));
  if (!mapped) return false;
  STATE.selectedCells = new Set([mapped]);
  focusCell(mapped);

  detailSig = '';
  renderMap();
  autosaveLayout(false);
  return true;
}

const LS_LAYOUT = 'warehouse_layout_v1';
const LS_DATA = 'warehouse_movements_v1';
const LS_STOCK = 'warehouse_stock_v1';
const LS_FILE_STAMP = 'warehouse_layout_file_ts';
const PERIODS = ['all', 'today', 'yesterday', '7', '30', 'day'];

function buildLayoutJSON(){
  return {
    kind:'layout',
    version: layoutGeom === 'legacy' ? 1 : 2,
    geom: layoutGeom,
    timestamp:new Date().toISOString(),
    palletCount:STATE.palletCount,
    cellList:STATE.cellList,
    removed:[...STATE.removed],
    view:{scale:VIEW.scale, tx:VIEW.tx, ty:VIEW.ty},
    offsets:CELL_OFFSETS,
    flowPos:FLOW_POS,
    period:STATE.period,
    periodDate:periodDateValue(),
    stage:STATE.stage,
    cameras:STATE.cameras,
    zones:STATE.zones,
    sideOpen: STATE.sideOpen !== false,
    camStock: STATE.camStock !== false,
    camMove: !!STATE.camMove,
    camAudit: STATE.camAudit !== false,
  };
}
function buildDataJSON(){
  return {kind:'movements', version:1, timestamp:new Date().toISOString(), items:STATE.items, flow:STATE.flow};
}
function buildSnapshot(){
  const obj = buildLayoutJSON();
  obj.kind = 'warehouse';
  obj.items = STATE.items;
  obj.flow = STATE.flow;
  obj.stock = STATE.stock;
  return obj;
}
function autosaveLayout(immediate){
  const run = () => { try { localStorage.setItem(LS_LAYOUT, JSON.stringify(buildLayoutJSON())); } catch (_) {} };
  clearTimeout(layoutTimer);
  if (immediate) run();
  else layoutTimer = setTimeout(run, 250);
}
function autosaveData(){
  try { localStorage.setItem(LS_DATA, JSON.stringify(buildDataJSON())); } catch (_) {}
}
function autosaveStock(){
  try {
    localStorage.setItem(LS_STOCK, JSON.stringify({kind:'stock', version:1, timestamp:new Date().toISOString(), items:STATE.stock}));
  } catch (_) {}
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2500);
}
function applyLayout(obj){
  if (Array.isArray(obj.cellList)) STATE.cellList = obj.cellList.slice();
  if (typeof obj.palletCount === 'number') STATE.palletCount = obj.palletCount;
  STATE.removed = new Set(Array.isArray(obj.removed) ? obj.removed : []);
  if (obj.view){
    VIEW.scale = +obj.view.scale || 1;
    VIEW.tx = +obj.view.tx || 0;
    VIEW.ty = +obj.view.ty || 0;
  }
  Object.keys(CELL_OFFSETS).forEach(k => delete CELL_OFFSETS[k]);
  if (obj.offsets){
    Object.entries(obj.offsets).forEach(([c, o]) => {
      CELL_OFFSETS[c] = {dx:+o.dx || 0, dy:+o.dy || 0, pinned:!!o.pinned};
    });
  }
  Object.keys(FLOW_POS).forEach(k => delete FLOW_POS[k]);
  if (obj.flowPos){
    Object.entries(obj.flowPos).forEach(([k, p]) => {
      if (p && isFinite(+p.x) && isFinite(+p.y)) FLOW_POS[k] = {x:+p.x, y:+p.y};
    });
  }
  if (PERIODS.indexOf(obj.period) >= 0){
    STATE.period = obj.period;
    $('#period').value = obj.period;
  }
  if (obj.periodDate) $('#periodDate').value = obj.periodDate;
  if (obj.stage === 'stock' || obj.stage === 'move' || obj.stage === 'audit') STATE.stage = obj.stage;
  if (typeof obj.sideOpen === 'boolean') STATE.sideOpen = obj.sideOpen;
  if (typeof obj.camStock === 'boolean') STATE.camStock = obj.camStock;
  if (typeof obj.camMove === 'boolean') STATE.camMove = obj.camMove;
  if (typeof obj.camAudit === 'boolean') STATE.camAudit = obj.camAudit;
  if (Array.isArray(obj.cameras)) STATE.cameras = normalizeCameras(obj.cameras);
  if (Array.isArray(obj.zones)) STATE.zones = normalizeZones(obj.zones);
  const legacy = !(obj.geom === 'fixed' || (obj.version >= 2 && obj.geom !== 'legacy'));
  layoutGeom = legacy ? 'legacy' : 'fixed';
  if (legacy) expandLegacyToFixed();
  syncStageUI();
}
function looksLikeStock(obj){
  if (!obj || obj.kind === 'movements' || obj.kind === 'warehouse' || obj.kind === 'layout') return false;
  if (obj.kind === 'stock') return true;
  const it = Array.isArray(obj.items) && obj.items[0];
  return !!(it && (it.barcode || it.article) && !it.reg);
}
function loadJSON(text){
  let obj;
  try { obj = JSON.parse(text); }
  catch (_){ toast('Неверный файл'); return; }
  if (obj && obj.kind === 'cameras' && Array.isArray(obj.cameras)){
    STATE.cameras = normalizeCameras(obj.cameras);
    autosaveLayout(true);
    renderMap();
    toast('Камеры: ' + STATE.cameras.length);
    return;
  }
  if (obj && obj.kind === 'zones' && Array.isArray(obj.zones)){
    STATE.zones = normalizeZones(obj.zones);
    autosaveLayout(true);
    renderMap();
    toast('Зоны: ' + STATE.zones.length);
    return;
  }
  if (obj && obj.kind === 'audit'){
    toast('Это отчёт проверки. Карта берёт подозрения из остатков и движений.');
    return;
  }
  if (looksLikeStock(obj)){
    STATE.stage = 'stock';
    syncStageUI();
    setStock(obj.items, true, 'JSON');
    return;
  }
  const hasItems = Array.isArray(obj.items);
  const hasStock = Array.isArray(obj.stock);
  const hasLayout = obj.kind === 'layout' || obj.kind === 'warehouse' || obj.offsets || obj.view || Array.isArray(obj.cellList);
  if (!hasLayout && !hasItems && !hasStock){ toast('Неизвестный формат'); return; }
  if (hasLayout){
    applyLayout(obj);
    if (obj.timestamp) localStorage.setItem(LS_FILE_STAMP, obj.timestamp);
  }
  if (hasItems){
    STATE.items = obj.items;
    STATE.flow = Array.isArray(obj.flow) && obj.flow.length ? obj.flow : buildFlow(STATE.items);
    autosaveData();
  }
  if (hasStock){
    STATE.stock = mergeStock(obj.stock);
    stockCache = null;
    searchCache = null;
    autosaveStock();
  }
  STATE.selectedCells.clear();
  STATE._rev++;
  touchData();
  invalidateView();
  detailSig = '';
  pickSig = '';
  renderMap();
  autosaveLayout(true);
  toast('Загружено');
}
function restore(){
  try {
    const layout = localStorage.getItem(LS_LAYOUT);
    if (layout) applyLayout(JSON.parse(layout));
    const data = localStorage.getItem(LS_DATA);
    if (data){
      const obj = JSON.parse(data);
      if (Array.isArray(obj.items)){
        STATE.items = obj.items;
        STATE.flow = Array.isArray(obj.flow) && obj.flow.length ? obj.flow : buildFlow(STATE.items);
      }
    }
    const stock = localStorage.getItem(LS_STOCK);
    if (stock){
      const obj = JSON.parse(stock);
      if (Array.isArray(obj.items) && obj.items.length) STATE.stock = obj.items;
    }
  } catch (_) {}
}
