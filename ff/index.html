<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1b1e;color:#e6e6e6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #map{display:block;width:100vw;height:100vh;background:#1a1b1e;cursor:default}
  #map.dragging{cursor:grabbing}
  #map.marquee{cursor:crosshair}
  button,select,input{font:inherit;color:#e6e6e6}
  .bar{
    position:fixed;z-index:20;top:10px;left:10px;right:10px;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;
    min-height:48px;padding:6px 8px 6px 14px;
    background:rgba(32,33,36,.94);
    border:1px solid #3a3b40;border-radius:12px;
    backdrop-filter:blur(10px);
    user-select:none;
  }
  .brand{font-weight:600;font-size:14px;margin-right:4px}
  .sep{width:1px;height:18px;background:#3a3b40;margin:0 2px}
  .spacer{flex:1;min-width:8px}
  .status{font-size:12px;color:#9a9aa3;white-space:nowrap}
  .btn{
    width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;
    border:none;background:transparent;border-radius:8px;cursor:pointer;padding:0;color:#e6e6e6;
  }
  .btn:hover{background:#2e2f34}
  .btn:disabled{opacity:.28;cursor:default}
  .btn:disabled:hover{background:transparent}
  .ico{width:20px;height:20px;fill:currentColor;display:block}
  select,input[type=date],.dialog input{
    height:32px;border:1px solid #3a3b40;border-radius:8px;background:#26272b;padding:0 8px;font-size:13px;outline:none;
  }
  select:focus,input:focus{border-color:#c8c8c8}
  .dialog{
    position:fixed;z-index:30;top:64px;left:12px;
    display:flex;align-items:center;gap:8px;
    background:#26272b;border:1px solid #3a3b40;border-radius:12px;
    padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  .dialog[hidden],#periodDate[hidden],#detail[hidden]{display:none !important}
  .dialog-label{font-size:12px;color:#b0b0b6;white-space:nowrap}
  .dialog input{width:220px}
  .textbtn{height:32px;padding:0 12px;border:none;border-radius:8px;background:#e6e6e6;color:#1a1b1e;font-size:13px;cursor:pointer}
  .textbtn:hover{background:#fff}
  #detail{
    position:fixed;z-index:15;left:12px;bottom:12px;width:320px;
    max-height:min(440px,48vh);overflow:auto;
    background:#26272b;border:1px solid #3a3b40;border-radius:12px;
    padding:12px 14px;font-size:12.5px;line-height:1.4;
  }
  #detail h3{margin:0 0 4px;font-size:14px;font-weight:600}
  #detail .sub{color:#a3a3ab;margin-bottom:8px}
  #detail .mv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid #35363b}
  #detail .empty{color:#8d8d96}
  .tip{
    position:fixed;z-index:50;pointer-events:none;
    background:#26272b;color:#e6e6e6;border:1px solid #3a3b40;border-radius:8px;
    padding:7px 10px;font-size:12px;line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;white-space:nowrap;
  }
  .toast{
    position:fixed;z-index:70;left:50%;bottom:16px;transform:translateX(-50%);
    background:#e6e6e6;color:#1a1b1e;border-radius:8px;padding:8px 14px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<div class="bar">
  <div class="brand">Склад</div>
  <select id="period" title="Период движений">
    <option value="all">Всё время</option>
    <option value="today">Сегодня</option>

    <option value="7">7 дней</option>
    <option value="30">30 дней</option>
    <option value="day">Дата</option>

  <input type="date" id="periodDate" title="День" hidden>
  <span class="sep"></span>
  <button type="button" class="btn" id="addCell" title="Добавить ячейку" aria-label="Добавить ячейку"><svg class="ico" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg></button>

  <button type="button" class="btn" id="deleteCell" title="Удалить ячейки" aria-label="Удалить ячейки"><svg class="ico" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
  <button type="button" class="btn" id="pinCell" title="Закрепить" aria-label="Закрепить"><svg class="ico" viewBox="0 0 24 24"><path d="M16 9V4h1V2H7v2h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg></button>
  <span class="sep"></span>
  <button type="button" class="btn" id="saveAll" title="Скачать изменения" aria-label="Скачать изменения"><svg class="ico" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg></button>
  <button type="button" class="btn" id="loadBtn" title="Загрузить" aria-label="Загрузить"><svg class="ico" viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg></button>
  <input type="file" id="loadFile" accept="application/json,.json" hidden>
  <div class="spacer"></div>
  <div class="status" id="status"></div>
  <button type="button" class="btn" id="zoomOut" title="Отдалить" aria-label="Отдалить"><svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14zM7 9h5v1H7z"/></svg></button>
  <button type="button" class="btn" id="zoomIn" title="Приблизить" aria-label="Приблизить"><svg class="ico" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM9.5 14C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2z"/></svg></button>
  <button type="button" class="btn" id="fitBtn" title="Показать всё" aria-label="Показать всё"><svg class="ico" viewBox="0 0 24 24"><path d="M6 16h12V8H6v8zm2-6h8v4H8v-4zM7 3H3v4h2V5h2V3zm14 0h-4v2h2v2h2V3zM5 15H3v4h4v-2H5v-2zm16 0h-2v2h-2v2h4v-4z"/></svg></button>
</div>

<form class="dialog" id="dialog" hidden>
  <div class="dialog-label" id="dialogLabel">Адрес ячейки</div>
  <input id="cellAddr" type="text" placeholder="Например, B12-01" autocomplete="off" spellcheck="false">
  <button type="submit" class="textbtn">Готово</button>
  <button type="button" class="btn" id="dialogCancel" title="Закрыть" aria-label="Закрыть"><svg class="ico" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
</form>
<aside id="detail" hidden></aside>

<script src="layout.js"></script>
<script>

const tip = $('#tip');

/* ================================================================

   ================================================================ */
const DEFAULT_CELLS = `

B9-58 B9-59 B9-60 B1-01
`.split(/\s+/).filter(Boolean);

/* ================================================================
   СОСТОЯНИЕ
   ================================================================ */
const STATE = {
  items: [],
  flow: [],
  cellList: DEFAULT_CELLS.slice(),
  palletCount: 0,
  removed: new Set(),
  selectedCells: new Set(),
  hoveredCell: null,
  hoveredEdgeIdx: -1,
  mapMode: 'stock',
  showEdges: true,
  period: 'all',
  _rev: 0,
};

const CELL_OFFSETS = {};
const VIEW = { scale: 1, tx: 0, ty: 0 };
const MIN_ZOOM = 0.04;
const MAX_ZOOM = 8;

/* ================================================================
   ПАРСИНГ ЯЧЕЙКИ
   ================================================================ */
function parseCell(code){
  const s = String(code||'').trim();
  let m = s.match(/^([A-Za-zА-Яа-я]+)(\d+)(?:\/(\d+))?-(\d+)$/);
  if (m){
    const line = m[1].toUpperCase() + m[2] + (m[3] ? '/'+m[3] : '');
    return {line, slot: +m[4], special: false, raw: s};
  }
  m = s.match(/^([A-Za-zА-Яа-я]+)(\d+)$/);
  if (m) return {line: 'Спец', slot: 0, special: true, raw: s};
  m = s.match(/^ПМ-(\d+)-(\d+)$/);
  if (m) return {line: 'Паллеты L'+m[1], slot: +m[2], special: false, raw: s};
  return {line: 'Прочее', slot: 0, special: true, raw: s};
}

function cellStats(cell){
  let inQ=0, outQ=0, end=0, ops=0;
  STATE.items.forEach(x=>{
    if (x.cell !== cell) return;
    inQ += x.qIn; outQ += x.qOut; ops++; end = x.qEnd;
  });
  return {inQ, outQ, end, ops};
}

function lineOfCell(cell){
  const p = parseCell(cell);
  return p.special ? 'Спец/Прочее' : p.line;
}

/* ================================================================
   РЁБРА ДВИЖЕНИЯ
   ================================================================ */
const IN_NODE = 'Приход', OUT_NODE = 'Расход';

function buildFlow(items){
  const map = new Map();
  items.forEach(x=>{
    if (!map.has(x.reg)) map.set(x.reg, {reg:x.reg, date:x.date, type:x.type, moves:[]});
    const g = map.get(x.reg);
    g.moves.push({cell:x.cell, in:x.qIn, out:x.qOut});
    if (x.type==='in') g.type='in';
    else if (x.type==='out' && g.type!=='in') g.type='out';
  });
  const arr = [...map.values()].sort((a,b)=>{
    const da = a.date ? a.date.d.split('.').reverse().join('')+a.date.t : '';
    const db = b.date ? b.date.d.split('.').reverse().join('')+b.date.t : '';
    return da.localeCompare(db);
  });
  const edges = [];
  arr.forEach(g=>{
    const outs = g.moves.filter(m=>m.out>0 && m.cell);
    const ins = g.moves.filter(m=>m.in>0 && m.cell);
    const qty = Math.max(0, ...g.moves.map(m=>Math.max(m.in,m.out)));
    if (outs.length && ins.length){
      if (outs.length===1 && ins.length===1){
        edges.push({from: outs[0].cell, to: ins[0].cell, qty:Math.max(outs[0].out, ins[0].in),
                    type:'move', reg:g.reg, date:g.date});
      } else {
        const per = qty / Math.max(1, Math.min(outs.length, ins.length));
        outs.forEach(o => ins.forEach(i2 => {
          edges.push({from: o.cell, to: i2.cell, qty:Math.round(per)||1,
                      type:'move', reg:g.reg, date:g.date});
        }));
      }
    } else if (outs.length){
      outs.forEach(o => edges.push({from: o.cell, to: OUT_NODE, qty:o.out, type:'out', reg:g.reg, date:g.date}));
    } else if (ins.length){
      ins.forEach(i2 => edges.push({from: IN_NODE, to: i2.cell, qty:i2.in, type:'in', reg:g.reg, date:g.date}));
    }
  });
  return edges;
}

function extractDate(reg){
  const m = String(reg||'').match(/(\d{2}\.\d{2}\.\d{4})\s+(\d{1,2}:\d{2}:\d{2})/);
  return m ? {d:m[1], t:m[2]} : null;
}

/* ================================================================
   НОРМАЛИЗАЦИЯ
   ================================================================ */
function cleanCell(v){
  return (v ?? '').toString()
    .replace(/\u00A0/g, ' ')
    .replace(/\u2007/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function norm(v){ return cleanCell(v); }
function num(v){
  if (v === null || v === undefined) return 0;
  const s = String(v)
    .replace(/\u00A0/g,' ')
    .replace(/\s+/g,'')
    .replace(',', '.')
    .replace(/[^\d.\-]/g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

const HEADER_WORDS = ['ячейка','регистратор'];
function isHeaderRow(row){
  const cells = row.map(v => cleanCell(v).toLowerCase());
  return HEADER_WORDS.every(w => cells.some(c => c === w));
}
function findHeaderRow(rows){
  for (let i=0;i<rows.length;i++){
    if (isHeaderRow(rows[i] || [])) return i;
  }
  return -1;
}
function findCol(header, ...names){
  const nh = header.map(v => cleanCell(v).toLowerCase().replace(/\s+/g,' '));
  for (const name of names){
    const n = name.toLowerCase().replace(/\s+/g,' ');
    const i = nh.indexOf(n); if (i >= 0) return i;
  }
  for (const name of names){
    const n = name.toLowerCase().replace(/\s+/g,' ');
    const i = nh.findIndex(h => h.includes(n)); if (i >= 0) return i;
  }
  return -1;
}

function isServiceRow(cells){
  const first = cleanCell(cells[0] || '');
  const joined = cells.map(cleanCell).join(' ').toLowerCase();
  if (!first && cells.every(c => !cleanCell(c))) return true;
  if (/^отбор\s*:/i.test(first)) return true;
  if (/^контрагент$/i.test(first)) return true;
  if (/^артикул$/i.test(first)) return true;
  if (/^склад$/i.test(first)) return true;
  if (/^ооо\s+"/i.test(first)) return true;
  if (/^\d{4}-\d+/.test(first) && /утяжел|номенклатура/i.test(joined)) return true;
  if (/^склад\s+ижорский$/i.test(first)) return true;
  return false;
}

function parseMovement(rows){
  const headerIdx = findHeaderRow(rows);
  if (headerIdx < 0) return {error:'Не найдена строка заголовков («Ячейка» и «Регистратор»).'};
  const header = rows[headerIdx] || [];
  const idx = {
    cell:  findCol(header, 'Ячейка'),
    reg:   findCol(header, 'Регистратор'),
    start: findCol(header, 'Количество Начальный остаток', 'Начальный остаток'),
    in:    findCol(header, 'Количество Приход', 'Приход'),
    out:   findCol(header, 'Количество Расход', 'Расход'),
    end:   findCol(header, 'Количество Конечный остаток', 'Конечный остаток'),
  };
  if (idx.cell < 0 || idx.reg < 0) return {error:'В заголовке нет колонок «Ячейка» / «Регистратор».'};

  const items = [];
  for (let i=headerIdx+1;i<rows.length;i++){
    const r = rows[i] || [];
    if (isServiceRow(r)) continue;

    const reg  = cleanCell(r[idx.reg]);
    const cell = cleanCell(r[idx.cell]);
    if (!reg) continue;
    if (!/\d{2}\.\d{2}\.\d{4}/.test(reg) && !/^(поступлен|лист подбора|комплектац|перемещен|списан|реализац)/i.test(reg)) continue;

    let type = 'move';
    if (/поступлен/i.test(reg)) type = 'in';
    else if (/комплектац|списан|реализац/i.test(reg)) type = 'out';
    else if (/перемещен|лист подбора/i.test(reg)) type = 'move';

    items.push({
      reg, docType: reg.split(' ')[0] || reg, cell,
      qIn:    idx.in    >= 0 ? num(r[idx.in])    : 0,
      qOut:   idx.out   >= 0 ? num(r[idx.out])   : 0,
      qStart: idx.start >= 0 ? num(r[idx.start]) : 0,
      qEnd:   idx.end   >= 0 ? num(r[idx.end])   : 0,
      type, date: extractDate(reg),
    });
  }
  return {items};
}

document.addEventListener('paste', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  const dt = e.clipboardData; if (!dt) return;

  for (const it of dt.items){
    if (it.kind === 'file'){
      const f = it.getAsFile();
      if (f){ readFile(f); e.preventDefault(); return; }
    }
  }

  const html = dt.getData('text/html');
  const text = dt.getData('text/plain');

  let rows = null, src = '';
  if (html && /<table/i.test(html)){
    rows = parseHtmlTable(html);
    src = 'HTML';
  }
  if ((!rows || rows.length < 3) && text){
    const textRows = parsePlainText(text);
    if (!rows || textRows.length > rows.length){
      rows = textRows; src = 'TEXT';
    }
  }
  if (!rows || !rows.length){
    toast('Пустой буфер. Скопируйте таблицу из Excel/1С и нажмите Ctrl+V.', 'warn');
    return;
  }
  handleRows(rows, `Буфер: ${src}, строк ${rows.length}`);
  e.preventDefault();
});

function parsePlainText(text){
  const lines = text.split(/\r?\n/);
  const splitters = [
    l => l.split('\t'),
    l => l.split(/\s{2,}/),
    l => l.split(';'),
  ];
  let best = null, bestCount = -1;
  for (const split of splitters){
    const rows = lines.map(l => split(l).map(cleanCell));
    const hi = findHeaderRow(rows);
    if (hi >= 0){
      const n = rows.length - hi - 1;
      if (n > bestCount){ bestCount = n; best = rows; }
    }
  }
  if (best) return best;
  return lines.map(l => l.split('\t').map(cleanCell));
}

function readFile(file){
  const name = file.name || '';
  if (/\.(txt|csv)$/i.test(name)){
    const r = new FileReader();
    r.onload = ev => handleRows(parsePlainText(String(ev.target.result)), `Файл ${name}`);
    r.readAsText(file); return;
  }
  if (/\.json$/i.test(name)){
    const r = new FileReader();
    r.onload = ev => loadJSON(String(ev.target.result));
    r.readAsText(file); return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
      handleRows(rows, `Файл ${name}`);
    } catch(err){
      toast('Ошибка чтения файла: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseHtmlTable(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const table = doc.querySelector('table');
  if (!table) return null;
  const rows = [];
  table.querySelectorAll('tr').forEach(tr => {
    const cells = [...tr.querySelectorAll('th,td')].map(td =>
      (td.innerText || '').replace(/\u00A0/g,' ').trim()
    );
    if (cells.length) rows.push(cells);
  });
  return rows;
}

function handleRows(rows, src){
  if (!rows || !rows.length){ toast('Пустой буфер', 'warn'); return; }

  const headerIdx = findHeaderRow(rows);
  if (headerIdx >= 0){
    const data = parseMovement(rows);
    if (data.error){ toast(data.error, 'err'); return; }
    if (!data.items.length){
      toast(`Заголовок найден (${src}), но строк с данными нет. Скопируйте таблицу вместе с данными.`, 'warn');
      return;
    }
    STATE.items = data.items;
    STATE.flow = buildFlow(data.items);
    autosaveData();
    flashBadge(`Движений: ${data.items.length}`);
    toast(`Загружено движений: ${data.items.length} · ${src}`);
    renderMap();
    return;
  }

  const firstCol = rows.map(r => norm(r[0])).filter(Boolean);
  if (!firstCol.length){ toast('Пустой буфер', 'warn'); return; }

  const palletMatches = firstCol.filter(v => v.toLowerCase() === 'паллет-место').length;
  if (palletMatches >= Math.max(5, firstCol.length*0.8)){
    STATE.palletCount = palletMatches;
    STATE.cellList = []; STATE.items = []; STATE.flow = [];
    Object.keys(CELL_OFFSETS).forEach(k => delete CELL_OFFSETS[k]);
    STATE.selectedCells.clear();
    autosaveLayout();
    flashBadge(`Паллетомест: ${palletMatches}`);
    toast(`Построена сетка паллетомест: ${palletMatches}`);
    renderMap();
    return;
  }

  const cellRe = /^[A-Za-zА-Яа-я]+\d+([-/]\d+)?([-/]\d+)?$/;
  const looksLikeCells = firstCol.filter(v => cellRe.test(v.replace(/\s+/g,''))).length >= firstCol.length*0.7;
  if (looksLikeCells){
    STATE.palletCount = 0;
    STATE.cellList = firstCol;
    STATE.items = []; STATE.flow = [];
    Object.keys(CELL_OFFSETS).forEach(k => delete CELL_OFFSETS[k]);
    STATE.selectedCells.clear();
    autosaveLayout();
    flashBadge(`Ячеек: ${firstCol.length}`);
    toast(`Карта перестроена: ${firstCol.length} ячеек`);
    renderMap();
    return;
  }
  flashBadge('Формат не распознан');
  toast(`Не понял формат (${src}). Первые строки: ${rows.slice(0,3).map(r=>r.slice(0,4).join(' | ')).join(' ⏎ ')}`, 'warn');
}

function flashBadge(msg){ toast(msg); }

function naturalCompare(a, b){
  return String(a).localeCompare(String(b), 'ru', {numeric:true});
}

function buildGrid(){
  const cells = getAllCells();
  const byLine = new Map();
  cells.forEach(c => {
    const p = parseCell(c);
    if (!byLine.has(p.line)) byLine.set(p.line, []);
    byLine.get(p.line).push({cell:c, ...p});
  });
  const arr = [...byLine.entries()].map(([line, list]) => {
    list.sort((a, b) => naturalCompare(a.raw, b.raw));
    return {line, cells:list};
  });
  const order = (line) => {
    const m = line.match(/^B(\d+)(?:\/(\d+))?$/);
    if (m) return +m[1] * 100 + (m[2] ? +m[2] : 0);
    if (line.startsWith('Паллеты')) return 8000 + (+line.replace(/\D/g, '') || 0);
    if (line.startsWith('Спец')) return 9998;
    if (line.startsWith('Прочее')) return 9999;
    return 9000;
  };
  arr.sort((a, b) => order(a.line) - order(b.line) || naturalCompare(a.line, b.line));
  return arr;
}

let layoutGeom = 'fixed';
let geomExpanded = false;
const CELL = {w:148, h:58, gapX:16, gapY:20, padX:40, padY:96};

function computeLayout(){
  const grid = buildGrid();
  const {w, h, gapX, gapY, padX, padY} = CELL;
  const base = {};
  grid.forEach((g, li) => {
    const y = padY + li * (h + gapY);
    g.cells.forEach((c, ci) => {
      const x = padX + ci * (w + gapX);
      base[c.cell] = {x, y, w, h, line:g.line, slot:c.slot};
    });
  });
  return {grid, base};
}
function frameReadable(){
  const {base} = computeLayout();
  let minX = Infinity, minY = Infinity;
  Object.entries(base).forEach(([c, b]) => {
    const o = CELL_OFFSETS[c] || {dx:0, dy:0};
    minX = Math.min(minX, b.x + o.dx);
    minY = Math.min(minY, b.y + o.dy);
  });
  if (!isFinite(minX)) return;
  VIEW.scale = 1;
  VIEW.tx = 28 - minX;
  VIEW.ty = 84 - minY;
}
function expandLegacyToFixed(){
  const W = window.innerWidth || 1280;
  const H = window.innerHeight || 800;
  const old = computeLegacyLayout(W, H);
  const sample = Object.values(old.base)[0];
  const oldW = sample ? sample.w : 28;
  const oldH = sample ? sample.h : 22;
  const kX = CELL.w / Math.max(14, oldW);
  const kY = CELL.h / Math.max(16, oldH);
  let minX = Infinity, minY = Infinity;
  const pts = {};
  Object.entries(old.base).forEach(([c, b]) => {
    const o = CELL_OFFSETS[c] || {dx:0, dy:0, pinned:false};
    const x = b.x + o.dx, y = b.y + o.dy;
    pts[c] = {x, y, pinned:!!o.pinned};
    if (x < minX) minX = x;
    if (y < minY) minY = y;
  });
  if (!isFinite(minX)) minX = 0;
  if (!isFinite(minY)) minY = 0;
  layoutGeom = 'fixed';
  const fresh = computeLayout();
  Object.entries(pts).forEach(([c, p]) => {
    const n = fresh.base[c];
    if (!n) return;
    CELL_OFFSETS[c] = {
      dx:(p.x - minX) * kX - n.x,
      dy:(p.y - minY) * kY - n.y,
      pinned:p.pinned,
    };
  });
  Object.keys(CELL_OFFSETS).forEach(c => {
    if (pts[c]) return;
    CELL_OFFSETS[c].dx *= kX;
    CELL_OFFSETS[c].dy *= kY;
  });
  frameReadable();
  geomExpanded = true;
}
function computeLegacyLayout(W, H){
  const grid = buildGrid();
  const padX = 60, padY = 30, headerW = 70, headerH = 22;
  const lineH = Math.max(30, (H - padY * 2) / Math.max(1, grid.length));
  const maxCells = Math.max(1, ...grid.map(g => g.cells.length));
  const cellW = Math.max(14, Math.min(56, (W - padX * 2 - headerW) / maxCells));
  const cellH = Math.max(16, lineH - 8);
  const base = {};
  grid.forEach((g, li) => {
    const y = padY + headerH + li * lineH;
    g.cells.forEach((c, ci) => {
      const x = padX + headerW + ci * cellW;
      base[c.cell] = {x, y, w:cellW, h:cellH, line:g.line, slot:c.slot};
    });
  });
  return {grid, base};
}

function getAllCells(){
  if (STATE.palletCount > 0){
    const perLine = Math.ceil(STATE.palletCount / 11);
    const arr = [];
    for (let l = 1; l <= 11; l++){
      for (let s = 1; s <= perLine; s++){
        const idx = (l - 1) * perLine + s;
        if (idx > STATE.palletCount) break;
        arr.push('ПМ-' + l + '-' + String(s).padStart(2, '0'));
      }
    }
    return arr.filter(c => !STATE.removed.has(c));
  }
  const set = new Set(STATE.cellList.filter(c => !STATE.removed.has(c)));
  STATE.items.forEach(x => { if (x.cell && !STATE.removed.has(x.cell)) set.add(x.cell); });
  return [...set];
}

function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseItemDay(item){
  if (!item.date || !item.date.d) return null;
  const m = String(item.date.d).match(/(\d{2})\.(\d{2})\.(\d{4})/);
  if (!m) return null;
  return new Date(+m[3], +m[2] - 1, +m[1]);
}
function periodDateValue(){
  const el = $('#periodDate');
  return el && el.value ? el.value : '';
}
function inPeriod(item){
  if (STATE.period === 'all') return true;
  const day = parseItemDay(item);
  if (!day) return false;
  const today = startOfDay(new Date());
  const diff = Math.round((today - startOfDay(day)) / 86400000);
  if (STATE.period === 'today') return diff === 0;
  if (STATE.period === 'yesterday') return diff === 1;
  if (STATE.period === '7') return diff >= 0 && diff < 7;
  if (STATE.period === '30') return diff >= 0 && diff < 30;
  if (STATE.period === 'day'){
    const v = periodDateValue();
    if (!v) return diff === 0;
    const parts = v.split('-').map(Number);
    return day.getFullYear() === parts[0] && day.getMonth() === parts[1] - 1 && day.getDate() === parts[2];
  }
  return true;
}
function periodLabel(){
  if (STATE.period === 'today') return 'сегодня';
  if (STATE.period === 'yesterday') return 'вчера';
  if (STATE.period === '7') return '7 дней';
  if (STATE.period === '30') return '30 дней';
  if (STATE.period === 'day'){
    const v = periodDateValue();
    if (!v) return 'дату';
    const p = v.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }
  return 'всё время';
}
function collectStats(items){
  const map = new Map();
  items.forEach(x => {
    if (!x.cell) return;
    let s = map.get(x.cell);
    if (!s){ s = {inQ:0, outQ:0, end:0, ops:0}; map.set(x.cell, s); }
    s.inQ += x.qIn || 0;
    s.outQ += x.qOut || 0;
    s.ops++;
    s.end = x.qEnd || 0;
  });
  return map;
}
let viewCache = null;
function invalidateView(){ viewCache = null; }
function viewModel(){
  const date = periodDateValue();
  if (viewCache && viewCache.items === STATE.items && viewCache.period === STATE.period && viewCache.date === date && viewCache.rev === STATE._rev) return viewCache;
  const items = STATE.items.filter(inPeriod);
  viewCache = {items, period:STATE.period, date, rev:STATE._rev, stats:collectStats(items), flow:buildFlow(items)};
  return viewCache;
}
function statOf(stats, cell){
  return stats.get(cell) || {inQ:0, outQ:0, end:0, ops:0};
}

function cssToHex(color){
  if (!color) return 0xffffff;
  if (color.charAt(0) === '#') return parseInt(color.slice(1), 16);
  const m = color.match(/\d+/g);
  if (!m) return 0xffffff;
  return ((+m[0] & 255) << 16) | ((+m[1] & 255) << 8) | (+m[2] & 255);
}
function quadPoint(p1, c, p2, t){
  const u = 1 - t;
  return {
    x: u * u * p1.x + 2 * u * t * c.x + t * t * p2.x,
    y: u * u * p1.y + 2 * u * t * c.y + t * t * p2.y,
  };
}
function ensureCellView(cell){
  let v = cellViews.get(cell);
  if (v) return v;
  const root = new PIXI.Container();
  const gfx = new PIXI.Graphics();
  const label = new PIXI.Text({
    text: cell,
    style: {fontFamily:'system-ui, Segoe UI, sans-serif', fontSize:28, fontWeight:'700', fill:'#f2f2f2'},
  });
  label.anchor.set(0.5);
  root.addChild(gfx, label);
  cellLayer.addChild(root);
  v = {root, gfx, label, sig:''};
  cellViews.set(cell, v);
  return v;
}
function ensureNodeView(key){
  let v = nodeViews.get(key);
  if (v) return v;
  const root = new PIXI.Container();
  const gfx = new PIXI.Graphics();
  const label = new PIXI.Text({

  root.addChild(gfx, label);
  nodeLayer.addChild(root);
  v = {root, gfx, label};
  nodeViews.set(key, v);

}

function renderMap(){
  if (!world) return;
  const W = window.innerWidth, H = window.innerHeight;
  const {base} = computeLayout();
  const view = viewModel();
  const stats = view.stats;
  let maxStock = 1;
  stats.forEach(s => { if (s.ops > 0 && s.end > maxStock) maxStock = s.end; });

  world.position.set(VIEW.tx, VIEW.ty);
  world.scale.set(VIEW.scale);

  const positions = {};
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  Object.entries(base).forEach(([cell, b]) => {
    const off = CELL_OFFSETS[cell] || {dx:0, dy:0};
    const pos = {x:b.x + off.dx, y:b.y + off.dy, w:b.w, h:b.h};
    positions[cell] = pos;
    minX = Math.min(minX, pos.x);
    minY = Math.min(minY, pos.y);
    maxX = Math.max(maxX, pos.x + pos.w);
    maxY = Math.max(maxY, pos.y + pos.h);
  });
  if (!isFinite(minX)){ minX = 0; minY = 0; maxX = 0; maxY = 0; }

  const edgeInfo = [];
  edgeGfx.clear();
  const aliveNodes = new Set();
  if (view.flow.length){
    const aggMap = new Map();
    view.flow.forEach(e => {
      const k = e.type + '|' + e.from + '|' + e.to;
      if (!aggMap.has(k)) aggMap.set(k, {from:e.from, to:e.to, qty:0, type:e.type, regs:[], dates:[]});
      const o = aggMap.get(k);
      o.qty += e.qty;
      if (e.reg) o.regs.push(e.reg);
      if (e.date) o.dates.push(e.date);
    });
    const agg = [...aggMap.values()];
    const maxQ = Math.max(1, ...agg.map(e => e.qty));
    const nodePos = {};
    Object.entries(positions).forEach(([cell, b]) => {
      nodePos[cell] = {x:b.x + b.w / 2, y:b.y + b.h / 2};
    });
    nodePos[IN_NODE] = {x:minX - 90, y:minY - 20};
    nodePos[OUT_NODE] = {x:maxX + 90, y:maxY + 20};

    const buckets = new Map();
    agg.forEach((e, idx) => {
      const p1 = nodePos[e.from], p2 = nodePos[e.to];
      if (!p1 || !p2) return;
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const bend = 0.18;
      const mx = (p1.x + p2.x) / 2 - dy * bend;
      const my = (p1.y + p2.y) / 2 + dx * bend;
      const hovered = idx === STATE.hoveredEdgeIdx;
      const width = Math.max(1.5, Math.min(6, 1.5 + 4 * (e.qty / maxQ)));
      const color = e.type === 'out' ? 0xf0c27a : (e.type === 'in' ? 0x8eb6ff : 0xd5d5da);
      const alpha = hovered ? 0.95 : 0.42;
      const key = (hovered ? 'h' : 'n') + '|' + color + '|' + width.toFixed(1) + '|' + (e.type === 'out' ? 'd' : 's');
      if (!buckets.has(key)) buckets.set(key, {color, width, alpha, dashed:e.type === 'out', items:[]});
      buckets.get(key).items.push({p1, p2, mx, my});
      const tx = p2.x - mx, ty = p2.y - my;
      const tlen = Math.hypot(tx, ty) || 1;
      const ux = tx / tlen, uy = ty / tlen;
      const ah = 10;
      const ax = p2.x - ux * ah, ay = p2.y - uy * ah;
      edgeGfx.poly([
        p2.x - ux * 2, p2.y - uy * 2,
        ax - uy * ah * 0.45, ay + ux * ah * 0.45,
        ax + uy * ah * 0.45, ay - ux * ah * 0.45,
      ]);
      edgeGfx.fill({color, alpha});
      edgeInfo.push({idx, e, mx, my, p1, p2});
    });
    buckets.forEach(bucket => {
      bucket.items.forEach(it => {
        const c = {x:it.mx, y:it.my};
        if (!bucket.dashed){
          edgeGfx.moveTo(it.p1.x, it.p1.y);
          edgeGfx.quadraticCurveTo(c.x, c.y, it.p2.x, it.p2.y);
        } else {
          for (let s = 0; s < 14; s += 2){
            const a = quadPoint(it.p1, c, it.p2, s / 14);
            const b = quadPoint(it.p1, c, it.p2, Math.min(1, (s + 1) / 14));
            edgeGfx.moveTo(a.x, a.y);
            edgeGfx.lineTo(b.x, b.y);
          }
        }
      });
      edgeGfx.stroke({width:bucket.width, color:bucket.color, alpha:bucket.alpha, cap:'round', join:'round'});
    });

    [[IN_NODE, nodePos[IN_NODE]], [OUT_NODE, nodePos[OUT_NODE]]].forEach(([key, p]) => {
      const used = agg.some(e => e.from === key || e.to === key);
      const v = nodeViews.get(key);
      if (!used){
        if (v) v.root.visible = false;
        return;
      }
      const view = ensureNodeView(key);
      aliveNodes.add(key);
      view.root.visible = true;
      view.root.position.set(p.x, p.y);
      view.gfx.clear();
      view.gfx.circle(0, 0, 28);
      view.gfx.fill(0xe6e6e6);
    });
  }
  nodeViews.forEach((v, key) => { if (!aliveNodes.has(key)) v.root.visible = false; });

  const hit = [];
  const alive = new Set();
  Object.entries(base).forEach(([cell, b]) => {
    const pos = positions[cell];
    const off = CELL_OFFSETS[cell] || {dx:0, dy:0, pinned:false};
    const st = statOf(stats, cell);
    const used = st.ops > 0;
    const selected = STATE.selectedCells.has(cell);
    const hovered = STATE.hoveredCell === cell;
    let fill = '#3a3b40';
    if (used){
      const t = Math.min(1, Math.max(0, st.end) / maxStock);
      fill = mixColor('#4a4b52', '#b4b4ba', Math.max(0.14, t));
    }
    if (hovered && !selected) fill = mixColor(fill, '#ffffff', 0.1);
    const stroke = selected ? '#3b82f6' : (off.pinned ? '#c8c8ce' : (used ? '#6e6f76' : '#4a4b52'));
    const lw = selected ? 3 : (off.pinned ? 2 : 1);
    const textColor = luminance(fill) < 150 ? '#f2f2f2' : '#1a1b1e';
    const sig = fill + '|' + stroke + '|' + lw + '|' + (off.pinned ? 1 : 0) + '|' + textColor + '|' + b.w + '|' + b.h;
    const viewCell = ensureCellView(cell);
    alive.add(cell);
    viewCell.root.visible = true;
    viewCell.root.position.set(pos.x, pos.y);
    if (viewCell.sig !== sig){
      viewCell.sig = sig;
      viewCell.gfx.clear();
      viewCell.gfx.roundRect(1, 1, Math.max(4, b.w - 2), Math.max(4, b.h - 2), 8);
      viewCell.gfx.fill(cssToHex(fill));
      viewCell.gfx.stroke({width:lw, color:cssToHex(stroke)});
      if (off.pinned){
        viewCell.gfx.rect(b.w - 10, 5, 4, 4);
        viewCell.gfx.fill(0xe6e6e6);
      }
      viewCell.label.text = cell;
      viewCell.label.style.fill = textColor;
      viewCell.label.scale.set(1);
      const maxW = Math.max(8, b.w - 22);
      const maxH = Math.max(8, b.h - 14);
      const fit = Math.min(maxW / Math.max(1, viewCell.label.width), maxH / Math.max(1, viewCell.label.height));
      viewCell.label.scale.set(fit);
    }
    viewCell.label.position.set(b.w / 2, b.h / 2);
    hit.push({cell, x:pos.x, y:pos.y, w:b.w, h:b.h});
  });
  cellViews.forEach((v, cell) => {
    if (alive.has(cell)) return;
    v.root.destroy({children:true});
    cellViews.delete(cell);
  });

  marqueeGfx.clear();
  if (MARQUEE && MARQUEE.active){
    const x1 = Math.min(MARQUEE.startWorld.x, MARQUEE.currentWorld.x);
    const y1 = Math.min(MARQUEE.startWorld.y, MARQUEE.currentWorld.y);
    const x2 = Math.max(MARQUEE.startWorld.x, MARQUEE.currentWorld.x);
    const y2 = Math.max(MARQUEE.startWorld.y, MARQUEE.currentWorld.y);
    marqueeGfx.rect(x1, y1, Math.max(1, x2 - x1), Math.max(1, y2 - y1));
    marqueeGfx.fill({color:0x3b82f6, alpha:0.16});
    marqueeGfx.stroke({width:2, color:0x3b82f6, alpha:0.95});
  }

  MAP = {W, H, hit, base, edgeInfo};
  updateChrome();
}

function plural(n, one, few, many){
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
function updateChrome(){
  const n = MAP && MAP.hit ? MAP.hit.length : getAllCells().length;
  const m = viewModel().items.length;
  const sel = STATE.selectedCells.size;
  let text = n + ' ' + plural(n, 'ячейка', 'ячейки', 'ячеек') + ' · ' + m + ' ' + plural(m, 'движение', 'движения', 'движений');
  if (sel) text += ' · выделено ' + sel;
  $('#status').textContent = text;
  $('#deleteCell').disabled = sel === 0;
  $('#renameCell').disabled = sel !== 1;
  $('#pinCell').disabled = sel === 0;
  updateDetail();
}
function typeName(t){
  if (t === 'in') return 'Приход';
  if (t === 'out') return 'Расход';
  return 'Перемещение';
}
function dateKey(item){
  if (!item || !item.date || !item.date.d) return '';
  const p = String(item.date.d).split('.');
  if (p.length < 3) return '';
  return p[2] + p[1] + p[0] + (item.date.t || '');
}
function updateDetail(){
  const el = $('#detail');
  if (STATE.selectedCells.size !== 1){
    el.hidden = true;
    return;
  }
  const cell = [...STATE.selectedCells][0];
  const rows = viewModel().items.filter(x => x.cell === cell).slice().sort((a, b) => dateKey(b).localeCompare(dateKey(a)));
  const st = statOf(viewModel().stats, cell);
  let html = '<h3>' + esc(cell) + '</h3>';
  html += '<div class="sub">За ' + esc(periodLabel()) + ' · остаток ' + fmt(st.end) + ' · приход ' + fmt(st.inQ) + ' · расход ' + fmt(st.outQ) + '</div>';
  if (!rows.length){
    html += '<div class="empty">Нет движений за выбранный период</div>';
  } else {
    rows.slice(0, 40).forEach(x => {
      const when = x.date ? (x.date.d + (x.date.t ? ' ' + x.date.t : '')) : 'без даты';
      const q = x.qIn > 0 ? '+' + fmt(x.qIn) : (x.qOut > 0 ? '−' + fmt(x.qOut) : fmt(0));
      html += '<div class="mv" title="' + esc(x.reg) + '"><span>' + esc(when) + ' · ' + esc(typeName(x.type)) + '</span><b>' + q + '</b></div>';
    });
    if (rows.length > 40) html += '<div class="empty">ещё ' + (rows.length - 40) + '</div>';
  }
  el.innerHTML = html;
  el.hidden = false;
}

function screenToWorld(p){
  return {x:(p.x - VIEW.tx) / VIEW.scale, y:(p.y - VIEW.ty) / VIEW.scale};
}
function hitCellAt(worldPt){
  if (!MAP || !MAP.hit) return null;
  for (let i = MAP.hit.length - 1; i >= 0; i--){
    const h = MAP.hit[i];
    if (worldPt.x >= h.x && worldPt.x <= h.x + h.w && worldPt.y >= h.y && worldPt.y <= h.y + h.h) return h;
  }
  return null;
}
function rectsIntersect(a, b){
  return !(a.x2 < b.x || b.x + b.w < a.x1 || a.y2 < b.y || b.y + b.h < a.y1);
}
function localPos(e){
  const r = canvas.getBoundingClientRect();
  return {x:e.clientX - r.left, y:e.clientY - r.top};
}

canvas.addEventListener('mousedown', e => {
  if (!MAP) return;
  const p = localPos(e);
  const pw = screenToWorld(p);
  const hit = hitCellAt(pw);

  if (e.button === 2 || e.altKey){
    panState = {x:p.x, y:p.y, tx:VIEW.tx, ty:VIEW.ty, moved:false};
    e.preventDefault();
    return;
  }

  if (e.ctrlKey || e.metaKey){
    ctrlTap.used = true;
    ctrlPress = {hit, worldStart:pw};
    MARQUEE = {active:true, startWorld:pw, currentWorld:pw, addToSelection:false};
    canvas.style.cursor = '';
    canvas.classList.add('marquee');
    e.preventDefault();
    return;
  }

  if (e.shiftKey && hit){
    if (STATE.selectedCells.has(hit.cell)) STATE.selectedCells.delete(hit.cell);
    else STATE.selectedCells.add(hit.cell);
    renderMap();
    e.preventDefault();
    return;
  }

  if (e.shiftKey && !hit){
    MARQUEE = {active:true, startWorld:pw, currentWorld:pw, addToSelection:true};
    canvas.classList.add('marquee');
    e.preventDefault();
    return;
  }

  if (!hit){
    panState = {x:p.x, y:p.y, tx:VIEW.tx, ty:VIEW.ty, moved:false};
    ctrlPress = {clearOnClick:true};
    return;
  }

  if (!STATE.selectedCells.has(hit.cell)){
    STATE.selectedCells.clear();
    STATE.selectedCells.add(hit.cell);
    renderMap();
  }

  const movable = [];
  STATE.selectedCells.forEach(c => {
    const off = CELL_OFFSETS[c] || {dx:0, dy:0, pinned:false};
    if (!off.pinned) movable.push(c);
  });
  if (!movable.length) return;
  const starts = {};
  movable.forEach(c => {
    const off = CELL_OFFSETS[c] || {dx:0, dy:0, pinned:false};
    starts[c] = {dx:off.dx, dy:off.dy};
  });
  dragState = {movable, starts, startWorld:pw, moved:false};
  canvas.classList.add('dragging');
  e.preventDefault();
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousemove', e => {
  if (!MAP) return;
  const p = localPos(e);
  const pw = screenToWorld(p);

  if (MARQUEE && MARQUEE.active){
    MARQUEE.currentWorld = pw;
    renderMap();
    return;
  }
  if (dragState){
    const dx = pw.x - dragState.startWorld.x;
    const dy = pw.y - dragState.startWorld.y;
    if (Math.abs(dx) + Math.abs(dy) > 1) dragState.moved = true;
    dragState.movable.forEach(c => {
      const s = dragState.starts[c];
      const prev = CELL_OFFSETS[c] || {};
      CELL_OFFSETS[c] = {dx:s.dx + dx, dy:s.dy + dy, pinned:!!prev.pinned};
    });
    renderMap();
    return;
  }
  if (panState){
    if (Math.abs(p.x - panState.x) + Math.abs(p.y - panState.y) > 3) panState.moved = true;
    VIEW.tx = panState.tx + (p.x - panState.x);
    VIEW.ty = panState.ty + (p.y - panState.y);
    renderMap();
    return;
  }

  const hit = hitCellAt(pw);
  let hoveredEdge = -1;
  if (MAP.edgeInfo && MAP.edgeInfo.length){
    let best = 12;
    MAP.edgeInfo.forEach(info => {
      const d = distToQuad(pw, info.p1, {x:info.mx, y:info.my}, info.p2);
      if (d < best){ best = d; hoveredEdge = info.idx; }
    });
  }
  const newHover = hit ? hit.cell : null;
  const changed = newHover !== STATE.hoveredCell || hoveredEdge !== STATE.hoveredEdgeIdx;
  STATE.hoveredCell = newHover;
  STATE.hoveredEdgeIdx = hoveredEdge;
  if (changed) renderMap();

  if (hoveredEdge >= 0 && MAP.edgeInfo){
    const e2 = MAP.edgeInfo.find(i => i.idx === hoveredEdge);
    const edge = e2 && e2.e;
    if (edge){
      const typeLabel = typeName(edge.type);
      let lines = '<b>' + typeLabel + '</b>: ' + esc(edge.from) + ' → ' + esc(edge.to) + '<br>Количество: <b>' + fmt(edge.qty) + '</b>';
      if (edge.regs && edge.regs.length === 1) lines += '<br>' + esc(edge.regs[0]);
      else if (edge.regs && edge.regs.length > 1) lines += '<br>Документов: ' + edge.regs.length;
      const d0 = edge.dates && edge.dates[0];
      if (d0) lines += '<br>' + esc(d0.d + ' ' + d0.t);
      tip.innerHTML = lines;
      tip.style.left = (e.clientX + 14) + 'px';
      tip.style.top = (e.clientY + 14) + 'px';
      tip.style.opacity = 1;
      canvas.style.cursor = 'default';
      return;
    }
  }
  if (hit){
    const st = statOf(viewModel().stats, hit.cell);
    const pinned = CELL_OFFSETS[hit.cell] && CELL_OFFSETS[hit.cell].pinned;
    tip.innerHTML = '<b>' + esc(hit.cell) + '</b><br>За ' + esc(periodLabel()) +
      '<br>Остаток <b>' + fmt(st.end) + '</b>' +
      '<br>Приход ' + fmt(st.inQ) + ' · Расход ' + fmt(st.outQ) +
      '<br>Операций ' + st.ops +
      (pinned ? '<br>Закреплено' : '');
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top = (e.clientY + 14) + 'px';
    tip.style.opacity = 1;
    canvas.style.cursor = 'grab';
  } else {
    tip.style.opacity = 0;
    canvas.style.cursor = '';
  }
});

window.addEventListener('mouseup', () => {
  if (MARQUEE && MARQUEE.active){
    const r = {
      x1: Math.min(MARQUEE.startWorld.x, MARQUEE.currentWorld.x),
      y1: Math.min(MARQUEE.startWorld.y, MARQUEE.currentWorld.y),
      x2: Math.max(MARQUEE.startWorld.x, MARQUEE.currentWorld.x),
      y2: Math.max(MARQUEE.startWorld.y, MARQUEE.currentWorld.y),
    };
    const moved = (r.x2 - r.x1) > 3 || (r.y2 - r.y1) > 3;
    if (moved){
      if (!MARQUEE.addToSelection) STATE.selectedCells.clear();
      (MAP.hit || []).forEach(h => {
        if (rectsIntersect(r, h)) STATE.selectedCells.add(h.cell);
      });
    } else if (ctrlPress && ctrlPress.hit){
      const cell = ctrlPress.hit.cell;
      if (STATE.selectedCells.has(cell)) STATE.selectedCells.delete(cell);
      else STATE.selectedCells.add(cell);
    } else {
      STATE.selectedCells.clear();
    }
    MARQUEE = null;
    ctrlPress = null;
    canvas.classList.remove('marquee');
    canvas.style.cursor = '';
    renderMap();
  }
  if (dragState){
    canvas.classList.remove('dragging');
    if (dragState.moved) autosaveLayout(true);
    dragState = null;
  }
  if (panState){
    if (panState.moved) autosaveLayout(true);
    else if (ctrlPress && ctrlPress.clearOnClick && STATE.selectedCells.size){
      STATE.selectedCells.clear();
      renderMap();
    }
    panState = null;
    ctrlPress = null;
  }
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const p = localPos(e);
  const pw = screenToWorld(p);
  const factor = e.deltaY < 0 ? 1.12 : 0.9;
  const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, VIEW.scale * factor));
  VIEW.tx = p.x - pw.x * next;
  VIEW.ty = p.y - pw.y * next;
  VIEW.scale = next;
  renderMap();
  autosaveLayout(false);
}, {passive:false});

function isTypingTarget(el){
  return !!(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}
window.addEventListener('keydown', e => {
  const typing = isTypingTarget(e.target);
  if (e.key === 'Control' || e.key === 'Meta'){
    if (!e.repeat){
      ctrlTap.down = !typing;
      ctrlTap.used = false;
    }
    if (!typing) canvas.classList.add('marquee');
    return;
  }
  if (e.ctrlKey || e.metaKey) ctrlTap.used = true;
  if (typing) return;
  if (e.key === 'Escape'){
    if (!$('#dialog').hidden){ closeDialog(); return; }
    if (STATE.selectedCells.size){
      STATE.selectedCells.clear();
      renderMap();
    }
  } else if (e.key === 'Delete' && STATE.selectedCells.size){
    e.preventDefault();
    deleteSelected();
  }
});
window.addEventListener('keyup', e => {
  if (e.key !== 'Control' && e.key !== 'Meta') return;
  const typing = isTypingTarget(e.target);
  if (!typing && ctrlTap.down && !ctrlTap.used && STATE.selectedCells.size){
    STATE.selectedCells.clear();
    renderMap();
  }
  ctrlTap.down = false;
  ctrlTap.used = false;
  if (!(MARQUEE && MARQUEE.active)) canvas.classList.remove('marquee');
});

});

function cellTaken(name, except){
  const n = name.toLowerCase();
  return getAllCells().some(c => c !== except && c.toLowerCase() === n);
}
function materializeCells(){
  if (STATE.palletCount > 0){
    STATE.cellList = getAllCells();
    STATE.palletCount = 0;
  }
}
function focusCell(cell){
  const W = window.innerWidth, H = window.innerHeight;
  const b = computeLayout(W, H).base[cell];
  if (!b) return;
  const o = CELL_OFFSETS[cell] || {dx:0, dy:0};
  VIEW.tx = W / 2 - (b.x + o.dx + b.w / 2) * VIEW.scale;
  VIEW.ty = H / 2 - (b.y + o.dy + b.h / 2) * VIEW.scale;
}
function clearRemoved(name){
  const n = name.toLowerCase();
  [...STATE.removed].forEach(r => { if (String(r).toLowerCase() === n) STATE.removed.delete(r); });
}
function addCell(name){
  name = String(name || '').trim();
  if (!name){ toast('Введите адрес'); return false; }
  if (cellTaken(name)){ toast('Такая ячейка уже есть'); return false; }
  materializeCells();
  clearRemoved(name);
  STATE.cellList.push(name);
  STATE.selectedCells = new Set([name]);
  focusCell(name);
  autosaveLayout(true);
  renderMap();
  toast('Добавлена ' + name);
  return true;
}
function renameSelected(name){
  name = String(name || '').trim();
  const old = [...STATE.selectedCells][0];
  if (!old){ toast('Сначала выделите ячейку'); return false; }
  if (!name){ toast('Введите адрес'); return false; }
  if (name === old) return true;
  if (cellTaken(name, old)){ toast('Такая ячейка уже есть'); return false; }
  materializeCells();
  const i = STATE.cellList.indexOf(old);
  if (i >= 0) STATE.cellList[i] = name;
  else STATE.cellList.push(name);
  clearRemoved(name);
  if (CELL_OFFSETS[old]){
    CELL_OFFSETS[name] = CELL_OFFSETS[old];
    delete CELL_OFFSETS[old];
  }
  let changed = 0;
  STATE.items.forEach(it => { if (it.cell === old){ it.cell = name; changed++; } });
  STATE.flow = buildFlow(STATE.items);
  STATE._rev++;
  invalidateView();
  STATE.selectedCells = new Set([name]);
  autosaveLayout(true);
  if (changed) autosaveData();
  renderMap();
  toast('Адрес: ' + name);
  return true;
}
function deleteSelected(){
  const list = [...STATE.selectedCells];
  if (!list.length){ toast('Сначала выделите ячейки'); return; }
  if (list.length > 20 && !confirm('Удалить ' + list.length + ' ячеек?')) return;
  materializeCells();
  const drop = new Set(list);
  STATE.cellList = STATE.cellList.filter(c => !drop.has(c));
  list.forEach(c => {
    STATE.removed.add(c);
    delete CELL_OFFSETS[c];
  });
  STATE.selectedCells.clear();
  autosaveLayout(true);
  renderMap();
  toast('Удалено: ' + list.length);
}
function togglePin(){
  const cells = [...STATE.selectedCells];
  if (!cells.length){ toast('Сначала выделите ячейки'); return; }
  const allPinned = cells.every(c => CELL_OFFSETS[c] && CELL_OFFSETS[c].pinned);
  cells.forEach(c => {
    const off = CELL_OFFSETS[c] || {dx:0, dy:0, pinned:false};
    off.pinned = !allPinned;
    CELL_OFFSETS[c] = off;
  });
  autosaveLayout(true);
  renderMap();
  toast(allPinned ? 'Закрепление снято' : 'Закреплено');
}

let dialogMode = 'add';

function closeDialog(){ $('#dialog').hidden = true; }

function zoomBy(factor){
  const W = window.innerWidth, H = window.innerHeight;
  const cx = W / 2, cy = H / 2;
  const pw = screenToWorld({x:cx, y:cy});
  const next = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, VIEW.scale * factor));
  VIEW.tx = cx - pw.x * next;
  VIEW.ty = cy - pw.y * next;
  VIEW.scale = next;
  renderMap();
  autosaveLayout(false);
}
function fitView(){
  const W = window.innerWidth, H = window.innerHeight;
  const base = computeLayout(W, H).base;
  const cells = Object.keys(base);
  if (!cells.length){
    VIEW.scale = 1; VIEW.tx = 0; VIEW.ty = 0;
    renderMap();
    autosaveLayout(true);
    return;
  }
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  cells.forEach(c => {
    const b = base[c];
    const o = CELL_OFFSETS[c] || {dx:0, dy:0};
    const x = b.x + o.dx, y = b.y + o.dy;
    minX = Math.min(minX, x);
    minY = Math.min(minY, y);
    maxX = Math.max(maxX, x + b.w);
    maxY = Math.max(maxY, y + b.h);
  });
  const padX = 28, padTop = 78, padBottom = 28;
  const bw = Math.max(1, maxX - minX);
  const bh = Math.max(1, maxY - minY);
  const scale = Math.min(2.2, Math.max(MIN_ZOOM, Math.min((W - padX * 2) / bw, (H - padTop - padBottom) / bh)));
  VIEW.scale = scale;
  VIEW.tx = (W - bw * scale) / 2 - minX * scale;
  VIEW.ty = padTop + ((H - padTop - padBottom) - bh * scale) / 2 - minY * scale;
  renderMap();
  autosaveLayout(true);
}

function syncPeriodUI(){
  $('#periodDate').hidden = STATE.period !== 'day';
}

const LS_LAYOUT = 'warehouse_layout_v1';
const LS_DATA = 'warehouse_movements_v1';
const LS_FILE_STAMP = 'warehouse_layout_file_ts';
const PERIODS = ['all', 'today', 'yesterday', '7', '30', 'day'];

function buildLayoutJSON(){
  return {
    kind:'layout',
    version: layoutGeom === 'legacy' ? 1 : 2,
    geom: layoutGeom,
    timestamp:new Date().toISOString(),
    palletCount:STATE.palletCount,
    cellList:STATE.cellList,
    removed:[...STATE.removed],
    view:{scale:VIEW.scale, tx:VIEW.tx, ty:VIEW.ty},
    offsets:CELL_OFFSETS,
    period:STATE.period,
    periodDate:periodDateValue(),
  };
}
function buildDataJSON(){
  return {kind:'movements', version:1, timestamp:new Date().toISOString(), items:STATE.items, flow:STATE.flow};
}
function buildSnapshot(){
  const obj = buildLayoutJSON();
  obj.kind = 'warehouse';
  obj.items = STATE.items;
  obj.flow = STATE.flow;
  return obj;
}
function autosaveLayout(immediate){
  const run = () => { try { localStorage.setItem(LS_LAYOUT, JSON.stringify(buildLayoutJSON())); } catch (_) {} };
  clearTimeout(layoutTimer);
  if (immediate) run();
  else layoutTimer = setTimeout(run, 250);
}
function autosaveData(){
  try { localStorage.setItem(LS_DATA, JSON.stringify(buildDataJSON())); } catch (_) {}
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function applyLayout(obj){
  if (Array.isArray(obj.cellList)) STATE.cellList = obj.cellList.slice();
  if (typeof obj.palletCount === 'number') STATE.palletCount = obj.palletCount;
  STATE.removed = new Set(Array.isArray(obj.removed) ? obj.removed : []);
  if (obj.view){
    VIEW.scale = +obj.view.scale || 1;
    VIEW.tx = +obj.view.tx || 0;
    VIEW.ty = +obj.view.ty || 0;
  }
  Object.keys(CELL_OFFSETS).forEach(k => delete CELL_OFFSETS[k]);
  if (obj.offsets){
    Object.entries(obj.offsets).forEach(([c, o]) => {
      CELL_OFFSETS[c] = {dx:+o.dx || 0, dy:+o.dy || 0, pinned:!!o.pinned};
    });
  }
  if (PERIODS.indexOf(obj.period) >= 0){
    STATE.period = obj.period;
    $('#period').value = obj.period;
  }
  if (obj.periodDate) $('#periodDate').value = obj.periodDate;
  const legacy = !(obj.geom === 'fixed' || (obj.version >= 2 && obj.geom !== 'legacy'));
  layoutGeom = legacy ? 'legacy' : 'fixed';
  if (legacy) expandLegacyToFixed();
  syncPeriodUI();
}
function loadJSON(text){
  let obj;
  try { obj = JSON.parse(text); }
  catch (_){ toast('Неверный файл'); return; }
  const hasItems = Array.isArray(obj.items);
  const hasLayout = obj.kind === 'layout' || obj.kind === 'warehouse' || obj.offsets || obj.view || Array.isArray(obj.cellList);
  if (!hasLayout && !hasItems){ toast('Неизвестный формат'); return; }
  if (hasLayout){
    applyLayout(obj);
    if (obj.timestamp) localStorage.setItem(LS_FILE_STAMP, obj.timestamp);
  }
  if (hasItems){
    STATE.items = obj.items;
    STATE.flow = Array.isArray(obj.flow) && obj.flow.length ? obj.flow : buildFlow(STATE.items);
    autosaveData();
  }
  STATE.selectedCells.clear();
  STATE._rev++;
  invalidateView();
  renderMap();
  autosaveLayout(true);
  toast('Загружено');
}
function restore(){
  try {
    const layout = localStorage.getItem(LS_LAYOUT);
    if (layout) applyLayout(JSON.parse(layout));
    const data = localStorage.getItem(LS_DATA);
    if (data){
      const obj = JSON.parse(data);
      if (Array.isArray(obj.items)){
        STATE.items = obj.items;
        STATE.flow = Array.isArray(obj.flow) && obj.flow.length ? obj.flow : buildFlow(STATE.items);
      }
    }
  } catch (_) {}
}

function bindUI(){
  $('#period').addEventListener('change', () => {
    STATE.period = $('#period').value;
    syncPeriodUI();
    invalidateView();
    renderMap();
    autosaveLayout(true);
  });
  $('#periodDate').addEventListener('change', () => {
    invalidateView();
    renderMap();
    autosaveLayout(true);
  });
  $('#addCell').addEventListener('click', () => openDialog('add'));
  $('#renameCell').addEventListener('click', () => openDialog('rename'));
  $('#deleteCell').addEventListener('click', deleteSelected);
  $('#pinCell').addEventListener('click', togglePin);
  $('#saveAll').addEventListener('click', () => {
    downloadJSON(buildSnapshot(), 'warehouse.json');
    toast('Файл скачан');
  });
  $('#loadBtn').addEventListener('click', () => $('#loadFile').click());
  $('#loadFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = ev => loadJSON(String(ev.target.result));
    r.readAsText(f);
    e.target.value = '';
  });
  $('#zoomIn').addEventListener('click', () => zoomBy(1.2));
  $('#zoomOut').addEventListener('click', () => zoomBy(1 / 1.2));
  $('#fitBtn').addEventListener('click', fitView);
  $('#dialog').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#cellAddr').value;
    const ok = dialogMode === 'rename' ? renameSelected(name) : addCell(name);
    if (ok) closeDialog();
  });
  $('#dialogCancel').addEventListener('click', closeDialog);
  window.addEventListener('resize', () => renderMap());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') autosaveLayout(true);
  });
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 2600);
}
function distToQuad(p, a, c, b){
  let best = Infinity;
  for (let i = 0; i <= 24; i++){
    const t = i / 24;
    const x = (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * c.x + t * t * b.x;
    const y = (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * c.y + t * t * b.y;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < best) best = d;
  }
  return best;
}
function roundedRect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function mixColor(a, b, t){
  const ca = hexToRgb(a), cb = hexToRgb(b);
  return 'rgb(' + Math.round(ca.r + (cb.r - ca.r) * t) + ',' + Math.round(ca.g + (cb.g - ca.g) * t) + ',' + Math.round(ca.b + (cb.b - ca.b) * t) + ')';
}
function hexToRgb(h){
  let s = h.replace('#', '');
  if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
  return {r:parseInt(s.slice(0, 2), 16), g:parseInt(s.slice(2, 4), 16), b:parseInt(s.slice(4, 6), 16)};
}
function luminance(color){
  let r, g, b;
  if (color.charAt(0) === '#'){
    const c = hexToRgb(color);
    r = c.r; g = c.g; b = c.b;
  } else {
    const m = color.match(/\d+/g);
    if (!m) return 255;
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  return 0.299 * r + 0.587 * g + 0.114 * b;
}
function fmt(n){ return Number(n || 0).toLocaleString('ru-RU'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function readSavedLayout(){
  try {
    const raw = localStorage.getItem(LS_LAYOUT);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}
function layoutNeedsFile(saved, file){
  if (!file) return false;
  const fileTs = file.timestamp || '';
  const stamp = localStorage.getItem(LS_FILE_STAMP);
  if (stamp && stamp === fileTs) return false;
  if (stamp && fileTs && stamp !== fileTs) return true;
  if (!saved) return true;
  if (!stamp && (saved.geom === 'legacy' || saved.version === 1)){
    return Date.parse(fileTs || 0) > Date.parse(saved.timestamp || 0);
  }
  if (!stamp) return true;
  return false;
}
function adoptDiskLayout(obj){
  if (!layoutNeedsFile(readSavedLayout(), obj)) return false;
  applyLayout(obj);
  localStorage.setItem(LS_FILE_STAMP, obj.timestamp || '1');
  STATE.selectedCells.clear();
  STATE._rev++;
  invalidateView();
  autosaveLayout(true);
  toast('Раскладка из layout.json');
  return true;
}
async function fetchDiskLayout(){
  try {
    const res = await fetch('layout.json', {cache:'no-store'});
    if (!res.ok) return;
    const obj = await res.json();
    if (adoptDiskLayout(obj)) renderMap();
  } catch (_) {}
}

async function boot(){
  await initPixi();
  bindUI();
  restore();
  adoptDiskLayout(window.WAREHOUSE_FILE_LAYOUT);
  if (geomExpanded) autosaveLayout(true);
  if (!periodDateValue()) $('#periodDate').value = todayISO();
  syncPeriodUI();
  renderMap();
  fetchDiskLayout();
}
boot();
</script>
