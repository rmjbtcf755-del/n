  $('#renameCell').addEventListener('click', () => openDialog('rename'));
  $('#deleteCell').addEventListener('click', deleteSelected);
  $('#pinCell').addEventListener('click', togglePin);
  const printMinus = $('#printMinus');
  if (printMinus) printMinus.addEventListener('click', printMinusSheet);
  $('#saveAll').addEventListener('click', () => {
    downloadJSON(buildLayoutJSON(), 'layout.json');
    downloadJSON(buildStockJSON(), 'stock.json');
    downloadJSON(buildDataJSON(), 'movements.json');
    downloadJSON(buildCamerasJSON(), 'cameras.json');
    downloadJSON(buildZonesJSON(), 'zones.json');
    downloadJSON(buildAuditJSON(), 'audit.json');
    toast('Скачаны layout, stock, movements, cameras, zones, audit');
  });
  $('#loadBtn').addEventListener('click', () => $('#loadFile').click());
  $('#loadFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) readFile(f);
  });
  $('#modeStock').addEventListener('click', () => setStage('stock'));
  $('#modeMove').addEventListener('click', () => setStage('move'));
  const modeAudit = $('#modeAudit');
  if (modeAudit) modeAudit.addEventListener('click', () => setStage('audit'));
  const addCamera = $('#addCamera');
  if (addCamera) addCamera.addEventListener('click', () => {
    if (!camerasVisible()){
      if (STATE.stage === 'move') STATE.camMove = true;
      else if (STATE.stage === 'audit') STATE.camAudit = true;
      else STATE.camStock = true;
    }
    placeTool = placeTool === 'camera' ? null : 'camera';
    syncToolUI();
    renderMap();
    toast(placeTool ? 'Клик по карте ставит камеру' : 'Отмена');
  });
  const addZone = $('#addZone');
  if (addZone) addZone.addEventListener('click', () => {
    placeTool = placeTool === 'zone' ? null : 'zone';
    syncToolUI();
    toast(placeTool ? 'Клик по карте ставит красную зону' : 'Отмена');
  });
  const camLayer = $('#camLayer');
  if (camLayer) camLayer.addEventListener('click', toggleCameras);
  const sideClose = $('#sideClose');
  if (sideClose) sideClose.addEventListener('click', () => { setSideOpen(false); autosaveLayout(true); });
  const sideOpenBtn = $('#sideOpen');
  if (sideOpenBtn) sideOpenBtn.addEventListener('click', () => { setSideOpen(true); autosaveLayout(true); });
  const side = $('#side');
  if (side) side.addEventListener('click', e => {
    if (e.target.closest('[data-print="minus"]')){ printMinusSheet(); return; }
    const fact = e.target.closest('[data-fact]');
    if (fact){
      const kind = fact.getAttribute('data-fact');
      if (kind === 'audit'){ STATE.sideTab = 'audit'; setStage('audit'); return; }
      if (kind === 'foreign'){ STATE.sideTab = 'audit'; sideSig = ''; updateSide(); return; }
      STATE.sideTab = 'report';
      setStage('stock');
      return;
    }
    const tab = e.target.closest('[data-tab]');
    if (tab){
      STATE.sideTab = tab.getAttribute('data-tab');
      sideSig = '';
      updateSide();
      return;
    }
    const cellEl = e.target.closest('[data-cell]');
    if (!cellEl) return;
    const cell = cellEl.getAttribute('data-cell');
    if (!focusMapped(cell)) toast(cell + ' — нет на этой карте, другой склад');
  });
  $('#search').addEventListener('input', () => {
    STATE.query = $('#search').value.trim();
    searchCache = null;
    pickSig = '';
    renderMap();
    fitMatches(false);
  });
  $('#search').addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); fitMatches(true); }
    if (e.key === 'Escape'){
      e.preventDefault();
      e.stopPropagation();
      if ($('#search').value){
        $('#search').value = '';
        STATE.query = '';
        searchCache = null;
        lastFitKey = '';
        pickSig = '';
        renderMap();
      } else $('#search').blur();
    }
  });
  $('#pick').addEventListener('click', e => {
    const addBtn = e.target.closest('[data-add]');
    if (addBtn){
      e.preventDefault();
      addCell(addBtn.getAttribute('data-add'));
      return;
    }
    const row = e.target.closest('.pick-row');
    if (row){
      if (row.getAttribute('data-on') === '1') focusMapped(row.getAttribute('data-cell'));
      return;
    }
    const head = e.target.closest('[data-barcode]');
    if (!head) return;
    const next = head.getAttribute('data-barcode') || head.getAttribute('data-article') || '';
    if (next.length < 2) return;
    $('#search').value = next;
    STATE.query = next.trim();
    searchCache = null;
    pickSig = '';
    renderMap();
    fitMatches(true);
  });
  $('#zoomIn').addEventListener('click', () => zoomBy(1.2));
  $('#zoomOut').addEventListener('click', () => zoomBy(1 / 1.2));
  $('#fitBtn').addEventListener('click', fitView);
  $('#dialog').addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#cellAddr').value;
    const ok = dialogMode === 'rename' ? renameSelected(name) : addCell(name);
    if (ok) closeDialog();
  });
  $('#dialogCancel').addEventListener('click', closeDialog);
  window.addEventListener('resize', () => renderMap());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') autosaveLayout(true);
  });
}

function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 2600);
}
function distToQuad(p, a, c, b){
  let best = Infinity;
  for (let i = 0; i <= 24; i++){
    const t = i / 24;
    const x = (1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * c.x + t * t * b.x;
    const y = (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * c.y + t * t * b.y;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < best) best = d;
  }
  return best;
}
function distToCubic(p, p0, p1, p2, p3){
  let best = Infinity;
  for (let i = 0; i <= 32; i++){
    const t = i / 32, u = 1 - t;
    const x = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x;
    const y = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y;
    const d = Math.hypot(p.x - x, p.y - y);
    if (d < best) best = d;
  }
  return best;
}
function roundedRect(ctx, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function mixColor(a, b, t){
  const ca = hexToRgb(a), cb = hexToRgb(b);
  return 'rgb(' + Math.round(ca.r + (cb.r - ca.r) * t) + ',' + Math.round(ca.g + (cb.g - ca.g) * t) + ',' + Math.round(ca.b + (cb.b - ca.b) * t) + ')';
}
function hexToRgb(h){
  let s = h.replace('#', '');
  if (s.length === 3) s = s.split('').map(ch => ch + ch).join('');
  return {r:parseInt(s.slice(0, 2), 16), g:parseInt(s.slice(2, 4), 16), b:parseInt(s.slice(4, 6), 16)};
}
function luminance(color){
  let r, g, b;
  if (color.charAt(0) === '#'){
    const c = hexToRgb(color);
    r = c.r; g = c.g; b = c.b;
  } else {
    const m = color.match(/\d+/g);
    if (!m) return 255;
    r = +m[0]; g = +m[1]; b = +m[2];
  }
  return 0.299 * r + 0.587 * g + 0.114 * b;
}
function fmt(n){ return Number(n || 0).toLocaleString('ru-RU'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function readSavedLayout(){
  try {
    const raw = localStorage.getItem(LS_LAYOUT);
    return raw ? JSON.parse(raw) : null;
  } catch (_) { return null; }
}
function layoutNeedsFile(saved, file){
  if (!file) return false;
  const fileTs = file.timestamp || '';
  const stamp = localStorage.getItem(LS_FILE_STAMP);
  if (stamp && stamp === fileTs) return false;
  if (stamp && fileTs && stamp !== fileTs) return true;
  if (!saved) return true;
  if (!stamp && (saved.geom === 'legacy' || saved.version === 1)){
    return Date.parse(fileTs || 0) > Date.parse(saved.timestamp || 0);
  }
  if (!stamp) return true;
  return false;
}
function adoptDiskLayout(obj){
  if (!layoutNeedsFile(readSavedLayout(), obj)) return false;
  applyLayout(obj);
  localStorage.setItem(LS_FILE_STAMP, obj.timestamp || '1');
  STATE.selectedCells.clear();
  STATE._rev++;
  invalidateView();
  autosaveLayout(true);
  toast('Раскладка из layout.json');
  return true;
}
async function fetchDiskLayout(){
  try {
    const res = await fetch('layout.json', {cache:'no-store'});
    if (!res.ok) return;
    const obj = await res.json();
    if (adoptDiskLayout(obj)) renderMap();
  } catch (_) {}
}

async function boot(){
  await initPixi();
  bindUI();
  restore();
  if (!STATE.stock.length && window.WAREHOUSE_STOCK && Array.isArray(window.WAREHOUSE_STOCK.items)){
    STATE.stock = mergeStock(window.WAREHOUSE_STOCK.items);
    autosaveStock();
  }
  if (!STATE.items.length && window.WAREHOUSE_MOVEMENTS && Array.isArray(window.WAREHOUSE_MOVEMENTS.items)){
    STATE.items = window.WAREHOUSE_MOVEMENTS.items;
    STATE.flow = buildFlow(STATE.items);
    autosaveData();
  }
  syncStageUI();
  adoptDiskLayout(window.WAREHOUSE_FILE_LAYOUT);
  if (geomExpanded) autosaveLayout(true);
  if (!periodDateValue()) $('#periodDate').value = todayISO();
  syncStageUI();
  touchData();
  renderMap();
  fetchDiskLayout();
  fetchKind('stock.json', 'stock', obj => {
    if (!Array.isArray(obj.items)) return;
    setStock(obj.items, false, 'stock.json');
  });
  fetchKind('movements.json', 'movements', obj => {
    if (!Array.isArray(obj.items)) return;
    STATE.items = obj.items;
    STATE.flow = Array.isArray(obj.flow) && obj.flow.length ? obj.flow : buildFlow(STATE.items);
    touchData();
    invalidateView();
    autosaveData();
    renderMap();
  });
  if (!STATE.cameras.length){
    fetchKind('cameras.json', 'cameras', obj => {
      STATE.cameras = normalizeCameras(obj.cameras || []);
      renderMap();
    });
  }
  if (!STATE.zones.length){
    fetchKind('zones.json', 'zones', obj => {
      STATE.zones = normalizeZones(obj.zones || []);
      renderMap();
    });
  }
}
boot();
</script>
